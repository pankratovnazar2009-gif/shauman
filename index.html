/* ======================= ЖИВА МАПА ТОЧОК (Leaflet) ======================= */
var _map = null, _sheetMap = null, _mapView = null, _mapWiredCity = '', _mapBasemap = 'dark';

var _PIN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
  '<path d="M12 2C7.86 2 4.5 5.36 4.5 9.5c0 5.28 6.02 11.34 6.96 12.24a.78.78 0 0 0 1.08 0C13.48 20.84 19.5 14.78 19.5 9.5 19.5 5.36 16.14 2 12 2z"/>' +
  '<circle cx="12" cy="9.3" r="2.6" fill="#17140a"/></svg>';

function _pinIcon(loc, focused) {
  var st = locStatus(loc, new Date());
  var cls = 'sh-pin' + (focused ? ' is-focus' : ' is-dim') + (st.kind === 'closed' ? ' is-closed' : '');
  var s = focused ? 40 : 30;
  return L.divIcon({
    className: focused ? 'sh-focus' : '',
    html: '<span class="' + cls + '" style="width:' + s + 'px;height:' + s + 'px">' + _PIN_SVG + '</span>',
    iconSize: [s, s], iconAnchor: [s / 2, s - 1], tooltipAnchor: [0, -s + 8]
  });
}

function _basemapLayer(kind) {
  // Esri ArcGIS Online — без API-ключа, надійно, темна палітра під бренд.
  if (kind === 'sat') {
    return L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, maxNativeZoom: 18, attribution: '&copy; Esri, Maxar' }
    );
  }
  return L.layerGroup([
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, maxNativeZoom: 16, attribution: '&copy; Esri' }
    ),
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, maxNativeZoom: 16, opacity: 0.9 }
    )
  ]);
}

/** Посилання на маршрут у рідних картах пристрою (Apple Maps на iOS, інакше Google Maps). */
function directionsUrl(loc) {
  var d = loc.ll[0] + ',' + loc.ll[1];
  if (/iPad|iPhone|iPod/.test(navigator.userAgent || '')) return 'https://maps.apple.com/?daddr=' + d + '&dirflg=d';
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(d) + '&travelmode=driving';
}

function _renderMapFallback(host) {
  var loc = locById(state.mapFocus) || LOCATIONS[0];
  host.className = 'map-fallback';
  host.innerHTML =
    '<p class="muted" style="font-size:13px;max-width:34ch">Інтерактивна мапа зараз недоступна. Точки — у списку нижче.</p>' +
    '<a class="btn btn-primary" style="min-width:200px" href="' + directionsUrl(loc) + '" target="_blank" rel="noopener noreferrer">' +
      icon('route', 18) + ' Маршрут: ' + esc(loc.addr) + '</a>';
}

/** (Пере)створення живої мапи на екрані «Мапа». Викликається з renderShell при nav==='map'. */
function wireMap() {
  var host = document.getElementById('liveMap');
  if (!host) return;
  if (_overlay) return;                       // мапа схована під шторкою — не чіпаємо
  if (!window.L) { _renderMapFallback(host); return; }

  var city = state.mapCity || state.profile.city || 'poznan';
  if (city !== 'all' && !CITIES.some(function (c) { return c.id === city; })) city = 'poznan';
  var focusId = state.mapFocus;
  var sameCity = _mapWiredCity === city;

  if (_map) { try { _map.remove(); } catch (e) {} _map = null; }

  _map = L.map(host, { zoomControl: false, attributionControl: false });
  L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(_map);
  L.control.zoom({ position: 'bottomright' }).addTo(_map);
  _basemapLayer(_mapBasemap).addTo(_map);

  LOCATIONS.forEach(function (loc) {
    var focused = loc.id === focusId;
    var m = L.marker(loc.ll, { icon: _pinIcon(loc, focused), riseOnHover: true, keyboard: false, title: loc.addr });
    m.on('click', function () { actions.openLocation({ id: loc.id }); });
    m.bindTooltip(loc.addr, { className: 'sh-tip', direction: 'top', permanent: focused, offset: [0, -4] });
    m.addTo(_map);
  });

  if (sameCity && _mapView) {
    _map.setView(_mapView.c, _mapView.z, { animate: false });
  } else {
    var pts = LOCATIONS.filter(function (l) { return city === 'all' || l.city === city; })
      .map(function (l) { return l.ll; });
    if (pts.length === 1) _map.setView(pts[0], 15);
    else _map.fitBounds(pts, { padding: [44, 44], maxZoom: 15 });
  }
  _mapWiredCity = city;

  _map.on('moveend zoomend', function () {
    if (!_map) return;
    var c = _map.getCenter();
    _mapView = { c: [c.lat, c.lng], z: _map.getZoom() };
  });
  setTimeout(function () { if (_map) _map.invalidateSize(false); }, 0);
}

/** Невелика статична (без перетягування) мапа у шторці точки. */
function wireSheetMap() {
  var host = document.getElementById('sheetMap');
  if (!host || !_overlay || _overlay.type !== 'location') return;
  var loc = locById(_overlay.locId);
  if (_sheetMap) { try { _sheetMap.remove(); } catch (e) {} _sheetMap = null; }
  if (!loc) return;
  if (!window.L) { host.style.background = 'var(--surface-2)'; return; }

  _sheetMap = L.map(host, {
    zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false, keyboard: false, tap: false, touchZoom: false
  });
  _basemapLayer('dark').addTo(_sheetMap);
  _sheetMap.setView(loc.ll, 15);
  L.marker(loc.ll, { icon: _pinIcon(loc, true), interactive: false, keyboard: false }).addTo(_sheetMap);
  // шторка виїжджає з анімацією — «добиваємо» розмір кілька разів, поки контейнер не влаштується
  [60, 220, 460].forEach(function (ms) {
    setTimeout(function () {
      if (!_sheetMap) return;
      _sheetMap.invalidateSize(false);
      _sheetMap.setView(loc.ll, 15, { animate: false });
    }, ms);
  });
}

screens.map = function () {
  var now = new Date();
  var city = state.mapCity || state.profile.city || 'poznan';
  if (city !== 'all' && !CITIES.some(function (c) { return c.id === city; })) city = 'poznan';

        esc(c.name) + '</button>';
    }).join('') + '</div>';

  var cnt = city === 'all' ? LOCATIONS.length : locsByCity(city).length;
  var head = '<div class="screen-pad" style="padding-bottom:0">' +
      '<p class="eyebrow">Наші точки</p>' +
      '<h1 class="h1" style="margin-top:6px">' + cnt + ' ' + plural(cnt, ['точка', 'точки', 'точок']) + ' · ' +
        (city === 'all' ? 'вся Польща' : esc(cityById(city).name)) + '</h1>' +
      '<p class="muted" style="font-size:13px;margin-top:8px">Рухай і наближай мапу — усі точки видно одразу. Тисни точку, щоб відкрити; маршрут прокладеться у твоїх картах.</p>' +
    '</div>';

  var mapBox = '<div class="map-wrap">' +
      '<div id="liveMap"></div>' +
      '<div class="map-tools" role="group" aria-label="Тип мапи">' +
        '<button data-action="setBasemap" data-kind="dark"' + (_mapBasemap !== 'sat' ? ' class="on"' : '') + '>Мапа</button>' +
        '<button data-action="setBasemap" data-kind="sat"' + (_mapBasemap === 'sat' ? ' class="on"' : '') + '>Супутник</button>' +
      '</div>' +
      '<button class="map-fit" data-action="fitAllPoints">' + icon('map', 13) + ' Всі точки</button>' +
    '</div>';

  var focus = locById(state.mapFocus);
  var list;
  if (city === 'all') {
    list = CITIES.map(function (c) {
      var locs = locsByCity(c.id);
      if (!locs.length) return '';
      return '<div class="city-group-label">' + esc(c.name) + ' · ' + esc(c.pl) + '</div>' +
        locs.map(function (loc) { return locCardHTML(loc, now, focus); }).join('');
    }).join('');
  } else {
    if (!focus || focus.city !== city) {
      var fav = locById(state.profile.favLoc);
      focus = (fav && fav.city === city) ? fav : locsByCity(city)[0];
    }
    list = locsByCity(city).map(function (loc) { return locCardHTML(loc, now, focus); }).join('');
  }

  return head + seg + mapBox + '<div>' + list + '</div>';
};

/* -------------------------- КАРТКА (QR) -------------------------- */
screens.card = function () {
  var tier = tierByPoints(state.lifetimePoints);
  var nt = nextTier(state.lifetimePoints);
  var pct = nt ? clamp(((state.lifetimePoints - tier.min) / (nt.min - tier.min)) * 100, 3, 100) : 100;

  var bars = '';
  var seed = state.points;
  for (var i = 0; i < 46; i++) { seed = (seed * 37 + 11) % 100; bars += '<i style="height:' + (26 + (seed % 40)) + 'px"></i>'; }

  var qr = '';
  var q = (state.points * 7 + 13);
  for (var k = 0; k < 121; k++) {
    q = (q * 41 + 7) % 997;
    var corner = (k < 33 && (k % 11 < 3)) || (k % 11 > 7 && k < 33) || (k > 87 && k % 11 < 3);
    qr += '<i class="' + ((q % 5 < 2 || corner) ? '' : 'off') + '"></i>';
  }

  return '<div class="loyalty-card">' +
      logoImg('lc-mark', '') +
      '<div class="lc-tier">' + esc(tier.name) + ' · картка лояльності</div>' +
      '<div class="lc-name">' + esc(state.profile.name) + '</div>' +
      '<div class="lc-balance mono">' + nf(state.points) + ' <small>шауманів</small></div>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pct) + '" aria-label="Прогрес до наступного рівня"><i style="width:' + pct + '%"></i></div>' +
      '<p class="muted mono" style="font-size:11px;margin-top:8px">' +
        (nt ? 'до рівня «' + esc(nt.name) + '»: ' + nf(nt.min - state.lifetimePoints) + ' шауманів' : 'максимальний рівень досягнуто') +
      '</p>' +
    '</div>' +
    '<div class="code-card">' +
      '<div class="cc-hint">покажіть на касі · нарахування 1 zł = ' + EARN_RATE + ' шаумани</div>' +
      '<div class="barcode" role="img" aria-label="Демонстраційний штрихкод картки">' + bars + '</div>' +
      '<div class="qr-grid" role="img" aria-label="Демонстраційний QR-код картки лояльності">' + qr + '</div>' +
      '<div class="cc-num">SHM · ' + String(100000 + (state.lifetimePoints % 900000)) + '</div>' +
    '</div>' +
    '<div class="screen-pad" style="padding-top:8px">' +
      '<div class="helper-note" style="margin:0"><span>' + icon('info', 14) + '</span>' +
      'Це демо. Реального сканування не відбувається — на касі касир вводить номер або сканує QR у справжній системі.</div>' +
    '</div>';
};

screens.wallet = function () {

function walletRewards() {
  var coupons = state.coupons.filter(function (c) { return !c.used; });
  var cHTML = coupons.length
    ? '<p class="section-label">Мої купони · покажи при оформленні</p>' +
      '<div style="padding:0 16px 6px">' + coupons.map(function (c) {
        return '<div class="coupon-row" style="margin:0 0 10px">' + icon(c.kind === 'disc' ? 'ticket' : 'gift', 18) +
          '<span><span class="cr-label">' + esc(c.label) + '</span><br>' +
          '<span class="cr-code mono">' + esc(c.code) + '</span></span></div>';
      }).join('') + '</div>'
    : '';

  var sorted = REWARDS.slice().sort(function (a, b) { return a.cost - b.cost; });
  var list = '<p class="section-label">Обміняти шаумани на їжу</p><div style="padding:0 16px 24px">' +
    sorted.map(function (rw) {
      var can = state.points >= rw.cost;
      return '<button class="reward-card" data-action="openReward" data-id="' + rw.id + '" ' +
        (can ? '' : 'aria-disabled="true"') + '>' +

        '<span><span class="rc-name">' + esc(rw.name) + '</span>' +
        '<span class="rc-cost mono">' + nf(rw.cost) + ' шауманів</span></span>' +
        '<span class="rc-cta mono">' + (can ? 'Обміняти' : 'Ще ' + nf(rw.cost - state.points)) + '</span>' +
      '</button>';
    }).join('') + '</div>';

  return cHTML + list;
}

/** Історія = чеки покупок (де, що, за скільки) — як у Biedronka */
function walletReceipts() {
  var orders = state.history.slice().sort(function (a, b) { return b.ts - a.ts; });
  if (!orders.length) {
    return stateBox(brandMark(), 'Ще немає покупок',
      'Тут зберігатимуться чеки: точка, позиції та сума кожного замовлення.',
      '<button class="btn btn-primary" data-action="nav" data-to="menu">До меню</button>');
  }
  return '<p class="section-label">Чеки покупок</p><div style="padding:0 16px 24px">' +
    orders.map(receiptCard).join('') + '</div>';
}

function receiptCard(o) {
  var loc = locById(o.locId) || {};
  var cityN = loc.city ? cityById(loc.city).name : '';
  var d = new Date(o.ts);
  var dstr = d.toLocaleDateString('uk-UA', { day: '2-digit', month: 'long' }) + ', ' +
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);

  var lines = o.lines.map(function (l) {
    var it = itemById(l.itemId);
    if (!it) return '';
    var row = '<div class="rc-line"><span>' + l.qty + '× ' + esc(it.name) + '</span>' +
      '<span class="mono">' + zl(it.price * l.qty) + '</span></div>';
    var adds = (l.addonIds || []).map(function (aid) {
      var a = addonById(aid);
      if (!a) return '';
      return '<div class="rc-line rc-sub"><span>+ ' + esc(a.name) + (l.qty > 1 ? ' ×' + l.qty : '') + '</span>' +
        '<span class="mono">' + zl(a.price * l.qty) + '</span></div>';
    }).join('');
    var sauceNames = (l.sauceIds || []).map(function (sid) { var s = sauceById(sid); return s ? s.name : ''; }).filter(Boolean);
    var sauce = sauceNames.length
      ? '<div class="rc-line rc-sub"><span>Соус: ' + esc(sauceNames.join(', ')) + '</span><span class="mono">0</span></div>'
      : '';
    return row + adds + sauce;
  }).join('');

  return '<div class="receipt">' +
    '<div class="rc-top"><span class="rc-date">' + esc(dstr) + '</span>' +
      '<span class="rc-total">' + zl(o.total) + '</span></div>' +
    '<div class="rc-loc">' + icon('map', 13) + '<span>SHAUMAN · ' + esc(loc.addr || '') +
      (cityN ? ' · ' + esc(cityN) : '') + '</span></div>' +
    '<div class="rc-items">' + lines + '</div>' +
    '<div class="rc-foot">' +
      '<span class="rc-num mono">#' + esc(o.id) + ' · ' + (o.pay === 'cash' ? 'готівка' : 'картка') + '</span>' +
      '<span class="rc-pts mono">◎ +' + nf(o.points) + '</span>' +
    '</div>' +
  '</div>';
}

/* -------------------------- ПРОФІЛЬ -------------------------- */
function profileRow(ic, title, sub, action, danger) {
  return '<button class="link-row" style="width:100%;text-align:left" data-action="' + action + '">' +
    '<span' + (danger ? ' style="color:var(--crit)"' : '') + '>' + icon(ic, 18) + '</span>' +
    '<span><span class="lr-text">' + esc(title) + '</span>' +
      (sub ? '<br><span class="lr-sub">' + esc(sub) + '</span>' : '') + '</span>' +
    '<span class="lr-arrow">' + icon('right', 16) + '</span></button>';
}

screens.profile = function () {
  var tier = tierByPoints(state.lifetimePoints);
  var orders = state.history.slice().sort(function (a, b) { return b.ts - a.ts; });

  var ordHTML = orders.length
    ? orders.slice(0, 3).map(function (o) {
        var loc = locById(o.locId) || {};
        var d = new Date(o.ts).toLocaleDateString('uk-UA', { day: '2-digit', month: 'short' });
        return '<button class="link-row" style="width:100%;text-align:left" data-action="nav" data-to="wallet" data-tab="history">' +
          '<span>' + icon('receipt', 18) + '</span>' +
          '<span><span class="lr-text">#' + esc(o.id) + ' · ' + zl(o.total) + '</span><br>' +
          '<span class="lr-sub">' + d + ' · ' + esc(loc.addr || '') + '</span></span>' +
          '<span class="lr-arrow mono" style="font-size:12px;color:var(--accent-ink)">+' + nf(o.points) + '</span></button>';
      }).join('') +
      '<button class="link-row" style="width:100%;text-align:left" data-action="nav" data-to="wallet" data-tab="history">' +
        '<span>' + icon('receipt', 18) + '</span><span class="lr-text">Усі чеки покупок</span>' +
        '<span class="lr-arrow">' + icon('right', 16) + '</span></button>'
    : '<div class="link-row"><span class="lr-sub" style="padding:8px 0">Замовлень ще немає.</span></div>';

  return '<div class="screen-pad" style="padding-bottom:8px">' +
      '<p class="eyebrow">Профіль</p>' +
      '<div style="display:flex;align-items:center;gap:12px;margin-top:10px">' +
        '<span style="width:48px;height:48px;border:1px solid var(--accent);border-radius:4px;display:grid;place-items:center;color:var(--accent-ink)">' + icon('user', 24) + '</span>' +
        '<span><span class="h2">' + esc(state.profile.name) + '</span><br>' +
        '<span class="muted mono" style="font-size:12px">рівень «' + esc(tier.name) + '»</span></span>' +
        '<button class="chip" data-action="editName" style="margin-left:auto">' + icon('edit', 14) + ' Змінити</button>' +
      '</div>' +
    '</div>' +
    '<div class="hazard" role="presentation"></div>' +
    '<p class="section-label">Останні замовлення</p>' + ordHTML +
    '<p class="section-label">Мережа</p>' +
    profileRow('map', 'Наші точки на мапі', 'Уся Польща · ' + LOCATIONS.length + ' ' + plural(LOCATIONS.length, ['точка', 'точки', 'точок']), 'openAllPoints') +
    profileRow('ticket', 'Використати промокод', 'Ввести код і отримати нагороду', 'openPromo') +
    '<p class="section-label">Про SHAUMAN</p>' +
    profileRow('spark', 'Ми в соцмережах', 'Instagram, TikTok, власники', 'openSocials') +
    profileRow('info', 'Контакти та допомога', 'Звʼязок, регламент', 'openContacts') +
    profileRow('menu', 'Налаштування', 'Тема, мова, анімація', 'openSettings') +
    '<div class="screen-pad" style="text-align:center">' +
      '<span class="demo-badge">Демо-збірка 0.9 · зроблено для SHAUMAN</span>' +
    '</div>';
};

/* --------------------------- КОШИК --------------------------- */
screens.cart = function () {
  if (!state.cart.length) {
    var sug = ITEMS.filter(function (i) { return i.tags.indexOf('hit') !== -1; })[0];
    return '<div class="screen-pad"><p class="eyebrow">Кошик</p></div>' +
      stateBox(brandMark(), 'Кошик порожній', 'Додайте щось смачне — і повертайтесь. Радимо почати з хіта.',
        '<button class="btn btn-primary" data-action="nav" data-to="menu">' + icon('menu', 18) + ' Відкрити меню</button>') +
      (sug ? '<p class="section-label">Страва дня</p>' +
        '<button class="menu-item" data-action="openItem" data-id="' + sug.id + '">' +
        '<span class="menu-thumb">' + itemArt(sug) + '</span>' +
        '<span style="text-align:left"><span class="mi-name">' + esc(sug.name) + '</span>' +
        '<span class="mi-desc">' + esc(sug.desc) + '</span></span>' +
        '<span class="mi-right"><span class="mi-price mono">' + zl(sug.price) + '</span></span></button>' : '');
  }

  var lines = state.cart.map(function (l) {
    var it = itemById(l.itemId);
    var adds = l.addonIds.map(function (id) { return (addonById(id) || {}).name; }).filter(Boolean).join(', ');
    var sauces = (l.sauceIds || []).map(function (id) { return (sauceById(id) || {}).name; }).filter(Boolean).join(', ');
    return '<div class="line-item">' +
      '<span class="li-thumb">' + itemArt(it) + '</span>' +
      '<span><span class="li-name">' + esc(it.name) + '</span>' +
        (sauces ? '<span class="li-add">Соус: ' + esc(sauces) + '</span>' : '') +
        (adds ? '<span class="li-add">+ ' + esc(adds) + '</span>' : '') +
        '<span class="mi-qty" style="margin-top:8px">' +
          '<button data-action="lineDec" data-line="' + l.lineId + '" aria-label="Менше">' + icon('minus', 16) + '</button>' +
          '<span aria-live="polite">' + l.qty + '</span>' +
          '<button data-action="lineInc" data-line="' + l.lineId + '" aria-label="Більше">' + icon('plus', 16) + '</button>' +
        '</span>' +
      '</span>' +
      '<span><span class="li-price mono">' + zl(linePrice(l)) + '</span><br>' +
      '<button class="li-rm" data-action="lineRemove" data-line="' + l.lineId + '">Прибрати</button></span>' +
    '</div>';
  }).join('');

  var sub = cartSubtotal();
  return '<div class="screen-pad" style="padding-bottom:8px;display:flex;justify-content:space-between;align-items:center">' +
      '<p class="eyebrow" style="margin:0">Кошик · ' + cartCount() + ' ' + plural(cartCount(), ['позиція', 'позиції', 'позицій']) + '</p>' +
      '<button class="chip" data-action="clearCart">' + icon('trash', 14) + ' Очистити</button>' +
    '</div>' +
    lines +
    '<div class="summary">' +
      '<div class="summary-row"><span class="muted">Сума</span><span class="mono">' + zl(sub) + '</span></div>' +
      '<div class="summary-row earn"><span>Нарахуємо шауманів</span><span>+' + nf(Math.round(sub) * EARN_RATE) + '</span></div>' +
      '<div class="summary-row total"><span>До сплати</span><span class="mono">' + zl(sub) + '</span></div>' +
    '</div>' +
    '<div class="screen-pad" style="padding-top:0">' +
      '<button class="btn btn-primary btn-block" data-action="goCheckout">Оформити замовлення ' + icon('right', 18) + '</button>' +
    '</div>';
};

/* ------------------------- ОФОРМЛЕННЯ ------------------------- */
screens.checkout = function () {
  var d = state.checkoutDraft;
  if (!d) { return stateBox(brandMark(), 'Немає що оформлювати', 'Кошик порожній.', '<button class="btn btn-primary" data-action="nav" data-to="menu">До меню</button>'); }

  var loc = locById(d.locId);
  var st = state.checkout;
  var sub = cartSubtotal();
  var disc = activeDiscount();
  var da = discountAmount(sub);
  var total = Math.max(0, sub - da);

  var coCity = (loc && loc.city) || state.profile.city || 'poznan';
  var locOpts = locsByCity(coCity).map(function (l) {
    var on = d.locId === l.id;
    var s = locStatus(l, new Date());
    return '<button class="radio-opt" data-action="setCheckout" data-key="locId" data-value="' + l.id + '" data-checked="' + on + '">' +
      '<span class="ro-mark"></span><span class="ro-body">' +
      '<span class="ro-name">' + esc(l.addr) + '</span>' +
      '<span class="ro-sub status-txt ' + s.kind + '">' + esc(s.text) + '</span></span></button>';
  }).join('');

  var pays = [
    ['cash', 'Готівка при отриманні', 'Оплата на касі'],
    ['card', 'Картка онлайн', 'Демо-оплата, без реальних списань'],
    ['card_fail', 'Тестова картка (помилка)', 'Показує обробку відмови оплати']
  ].map(function (p) {
    var on = d.pay === p[0];
    return '<button class="radio-opt" data-action="setCheckout" data-key="pay" data-value="' + p[0] + '" data-checked="' + on + '">' +
      '<span class="ro-mark"></span><span class="ro-body"><span class="ro-name">' + p[1] + '</span>' +
      '<span class="ro-sub">' + p[2] + '</span></span></button>';
  }).join('');

  var myCoupons = state.coupons.filter(function (c) { return !c.used && (c.kind === 'disc' || c.kind === 'free'); });
  var discPicker = myCoupons.map(function (c) {
    var on = d.discount === ('coupon:' + c.code);
    var subtxt;
    if (c.kind === 'free') {
      var v = freeItemValue(c.free);
      subtxt = v ? '−' + zl(v) + ' · ' + c.code : 'додай «' + esc(c.free.label) + '» у кошик';
    } else {
      subtxt = '−' + c.value + '% · ' + c.code;
    }
    return '<button class="radio-opt" data-action="pickCoupon" data-code="' + c.code + '" data-checked="' + on + '">' +
      '<span class="ro-mark"></span><span class="ro-body"><span class="ro-name">' + esc(c.label) + '</span>' +
      '<span class="ro-sub mono">' + subtxt + '</span></span></button>';
  }).join('');
  var discRowLabel = disc && disc.kind === 'free' ? 'Нагорода' : 'Знижка';

  var payBusy = st.status === 'processing';
  var payLabel = payBusy ? 'Обробляємо…' : (d.pay === 'cash' ? 'Підтвердити замовлення' : 'Оплатити ' + zl(total));

  var errBlock = st.status === 'failed'
    ? '<div class="helper-note" style="border-color:var(--crit)"><span style="color:var(--crit)">' + icon('info', 14) + '</span>' + esc(st.reason) + '</div>' +
      '<div class="screen-pad" style="padding-top:0"><button class="btn btn-primary btn-block" data-action="retryPay">' + icon('refresh', 18) + ' Спробувати ще раз</button></div>'
    : '';

  return '<div class="screen-pad" style="padding-bottom:8px;display:flex;align-items:center;gap:10px">' +
      '<button class="sheet-close" data-action="cancelCheckout" aria-label="Назад до кошика">' + icon('left', 18) + '</button>' +
      '<p class="eyebrow" style="margin:0">Оформлення · самовивіз</p>' +
    '</div>' +
    '<div class="hazard" role="presentation"></div>' +
    '<div class="screen-pad">' +
      '<p class="section-label" style="padding-left:0">Точка самовивозу · ' + esc(cityById(coCity).name) + '</p>' +
      '<div class="radio-list">' + locOpts + '</div>' +
      (loc && locStatus(loc, new Date()).kind === 'closed'
        ? '<div class="helper-note" style="margin:12px 0 0"><span>' + icon('info', 14) + '</span>Точка зараз зачинена — замовлення приймуть на час відкриття (' + loc.hours.open + ').</div>' : '') +

      '<p class="section-label" style="padding-left:0">Час</p>' +
      '<div class="radio-list">' +
        ['asap', '13:00', '18:30', '20:00'].map(function (t) {
          var on = d.time === t;
          return '<button class="radio-opt" data-action="setCheckout" data-key="time" data-value="' + t + '" data-checked="' + on + '">' +
            '<span class="ro-mark"></span><span class="ro-body"><span class="ro-name">' + (t === 'asap' ? 'Якнайшвидше (~20 хв)' : 'Сьогодні о ' + t) + '</span></span></button>';
        }).join('') +
      '</div>' +

      '<p class="section-label" style="padding-left:0">Оплата</p>' +
      '<div class="radio-list">' + pays + '</div>' +

      '<p class="section-label" style="padding-left:0">Промокод, купон або нагорода</p>' +
      '<div class="field" style="flex-direction:row;gap:8px">' +
        '<label class="sr-only" for="promoInput">Промокод</label>' +
        '<input id="promoInput" type="text" placeholder="Напр., ODESA" value="' + esc(d.promoInput || '') + '" autocomplete="off" spellcheck="false" style="flex:1" />' +
        '<button class="btn btn-ghost" data-action="applyPromo" style="min-height:46px">Застосувати</button>' +
      '</div>' +
      (discPicker ? '<div class="radio-list" style="margin-bottom:8px">' + discPicker + '</div>' : '') +
      (disc ? '<button class="chip" data-action="clearDiscount">' + icon('close', 14) + ' ' + esc(disc.label) + ' — прибрати</button>' : '') +
      (disc && disc.kind === 'free' && !da
        ? '<div class="helper-note" style="margin:10px 0 0"><span>' + icon('info', 14) + '</span>Додай «' + esc(disc.free.label) + '» у кошик — тоді нагорода застосується.</div>'
        : '') +
    '</div>' +

    '<div class="summary">' +
      '<div class="summary-row"><span class="muted">Сума</span><span class="mono">' + zl(sub) + '</span></div>' +
      (da ? '<div class="summary-row"><span class="muted">' + discRowLabel + '</span><span class="mono">−' + zl(da) + '</span></div>' : '') +
      '<div class="summary-row earn"><span>Нарахуємо шауманів</span><span>+' + nf(Math.round(total) * EARN_RATE) + '</span></div>' +
      '<div class="summary-row total"><span>До сплати</span><span class="mono">' + zl(total) + '</span></div>' +
    '</div>' +
    errBlock +
    '<div class="screen-pad" style="padding-top:0">' +
      '<button class="btn btn-primary btn-block" data-action="pay" ' + (payBusy ? 'aria-disabled="true"' : '') + '>' +
        (payBusy ? '' : icon('check', 18) + ' ') + payLabel +
      '</button>' +
      '<p class="muted" style="font-size:11px;text-align:center;margin-top:10px">Демонстраційне замовлення. Реальних платежів та передавання даних не відбувається.</p>' +
    '</div>';
};

/* --------------------- ЗАМОВЛЕННЯ ПРИЙНЯТО --------------------- */
screens.confirm = function () {
  var st = state.checkout;
  var order = st.status === 'done' ? state.history.find(function (o) { return o.id === st.orderId; }) : state.history[0];
  if (!order) { return stateBox(brandMark(), 'Замовлення не знайдено', '', '<button class="btn btn-primary" data-action="nav" data-to="menu">До меню</button>'); }
  var loc = locById(order.locId) || {};
  var nextRw = REWARDS.slice().sort(function (a, b) { return a.cost - b.cost; })
    .find(function (r) { return state.points < r.cost; });

  return '<div class="screen-pad" style="text-align:center;padding-top:40px">' +
      logoImg('confirm-logo') +
      '<p class="eyebrow">Замовлення прийнято</p>' +
      '<h1 class="h1 mono" style="margin-top:8px">#' + esc(order.id) + '</h1>' +
      '<p class="muted" style="font-size:13px;margin-top:8px">' + esc(loc.addr || '') + ' · ' +
        (order.status === 'ready' ? 'готово до видачі' : 'готуємо, ~' + order.etaMin + ' хв') + '</p>' +
    '</div>' +
    '<div class="hazard" role="presentation"></div>' +
    '<div class="summary">' +
      '<div class="summary-row"><span class="muted">До сплати</span><span class="mono">' + zl(order.total) + '</span></div>' +
      '<div class="summary-row"><span class="muted">Спосіб</span><span>' + (order.pay === 'cash' ? 'Готівка при отриманні' : 'Картка (демо)') + '</span></div>' +
      '<div class="summary-row earn"><span>Нараховано шауманів</span><span>+' + nf(order.points) + '</span></div>' +
      '<div class="summary-row total"><span>Баланс</span><span class="mono">' + nf(state.points) + ' ш</span></div>' +
    '</div>' +
    '<div class="screen-pad">' +
      '<button class="btn btn-primary btn-block" data-action="nav" data-to="wallet" data-tab="rewards">' + icon('gift', 18) + ' Мої нагороди</button>' +
      (nextRw
        ? '<p class="muted" style="font-size:12px;text-align:center;margin-top:10px">Ще ' + nf(nextRw.cost - state.points) + ' шауманів до нагороди «' + esc(nextRw.name) + '».</p>'
        : '<p class="muted" style="font-size:12px;text-align:center;margin-top:10px">Балів вистачає на будь-яку нагороду — забирай у розділі «Бонуси».</p>') +
    '</div>' +
    '<div class="screen-pad" style="padding-top:0;display:flex;gap:8px">' +
      '<button class="btn btn-ghost btn-block" data-action="nav" data-to="menu">До меню</button>' +
      '<button class="btn btn-ghost btn-block" data-action="nav" data-to="profile">Мої замовлення</button>' +
    '</div>';
};
</script>

<script>
"use strict";
/* =====================================================================
   ОВЕРЛЕЇ (шторки/модалки). Кожен повертає HTML для #overlay.
   ===================================================================== */

function sheetWrap(titleId, title, bodyHTML, footHTML, opts) {
  opts = opts || {};
  return '<div class="backdrop" data-action="closeOverlay"></div>' +
    '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + titleId + '">' +
      '<div class="sheet-grip" aria-hidden="true"></div>' +
      '<div class="sheet-head">' +
        (opts.mark ? '<span style="width:24px;height:24px;color:var(--accent-ink)">' + brandMark() + '</span>' : '') +
        '<span class="sh-title" id="' + titleId + '">' + esc(title) + '</span>' +
        '<button class="sheet-close" data-action="closeOverlay" aria-label="Закрити">' + icon('close', 18) + '</button>' +
      '</div>' +
      '<div class="sheet-body">' + bodyHTML + '</div>' +
      (footHTML ? '<div class="sheet-foot">' + footHTML + '</div>' : '') +
    '</div>';
}

function overlayHTML() {
  var ov = _overlay;
  if (!ov) return '';
  if (ov.type === 'item') return itemSheet(ov);
  if (ov.type === 'location') return locationSheet(ov);
  if (ov.type === 'reward') return rewardSheet(ov);
  if (ov.type === 'name') return nameSheet();
  if (ov.type === 'reset') return resetSheet();
  if (ov.type === 'promo') return promoSheet();
  if (ov.type === 'socials') return socialsSheet();
  if (ov.type === 'contacts') return contactsSheet();
  if (ov.type === 'settings') return settingsSheet();
  return '';
}

function promoSheet() {
  var body = '<form id="promoForm">' +
    '<p class="muted" style="font-size:13px;margin-bottom:12px">Введи промокод — і отримаєш нагороду на баланс або купон. Спробуй <b style="color:var(--accent-ink)">ODESA</b>, <b style="color:var(--accent-ink)">LAVASH</b> або <b style="color:var(--accent-ink)">SHAUM100</b>.</p>' +
    '<div class="field">' +
      '<label for="promoCode">Промокод</label>' +
      '<input id="promoCode" type="text" autocomplete="off" spellcheck="false" autocapitalize="characters" ' +
        'placeholder="Напр., ODESA" aria-describedby="promoMsg" />' +
      '<span class="err" id="promoMsg" role="status" style="color:var(--muted)"></span>' +
    '</div>' +
    '<button class="btn btn-primary btn-block" type="submit">Застосувати</button>' +
  '</form>';

function itemSheet(ov) {

    ? '<div class="cz-block">' +

/* =====================================================================
   ONBOARDING (перший запуск)
   ===================================================================== */
var _onbStep = 0;
var _onbDraft = { fav: null, name: '' };

function onboardingHTML() {
  if (state.onboarded) return '';
  var steps = [
    {
      mark: true,
      title: 'SHAUMAN',
      lead: 'своя людина в кожному місті',
      text: 'Перша мережа шаурми в Польщі. Смак Одеси — у Познані. Замовляй, забирай, збирай шаумани.',
      cta: 'Далі'
    },
    {
      title: 'Шаумани за кожен злотий',
      text: '1 zł = 3 шаумани. Накопичуй і обмінюй на реальну їжу — напій, сайд, хот-дог, а далі й шаурму. Обмін застосується прямо при оформленні.',
      cta: 'Далі'
    },
    {
      title: 'Обери улюблену точку',
      text: 'Показуватимемо її статус і підставлятимемо в замовлення. Змінити можна будь-коли.',
      cta: 'Почати',
      pick: true
    }
  ];
  var s = steps[_onbStep];

  var pick = s.pick ? '<div style="margin-top:16px">' + CITIES.map(function (c) {
    var locs = locsByCity(c.id);
    if (!locs.length) return '';
    return '<p class="section-label" style="padding:12px 0 6px">' + esc(c.name) + '</p>' +
      '<div class="radio-list">' + locs.map(function (l) {
        var on = _onbDraft.fav === l.id;
        return '<button class="radio-opt" data-onb="fav" data-id="' + l.id + '" data-checked="' + on + '">' +
          '<span class="ro-mark"></span><span class="ro-body"><span class="ro-name">' + esc(l.addr) + '</span>' +
          '<span class="ro-sub">' + esc(l.area) + '</span></span></button>';
      }).join('') + '</div>';
  }).join('') +
  '<div class="field" style="margin-top:16px"><label for="onbName">Ім’я (необовʼязково)</label>' +
  '<input id="onbName" type="text" maxlength="24" placeholder="Свій" value="' + esc(_onbDraft.name) + '" data-onb="name" autocomplete="name" /></div>' +
  '</div>' : '';

  var dots = '<div class="onb-dots" aria-hidden="true">' + steps.map(function (_, i) {
    return '<i class="' + (i <= _onbStep ? 'on' : '') + '"></i>';
  }).join('') + '</div>';

  var nextDisabled = s.pick && !_onbDraft.fav;

  return '<div class="onb" role="dialog" aria-modal="true" aria-label="Знайомство із застосунком">' +
    '<button class="onb-skip" data-onb="skip">Пропустити</button>' +
    '<div class="onb-body">' +
      (s.mark ? logoImg('onb-logo') : '') +
      (s.lead ? '<p class="eyebrow">' + esc(s.lead) + '</p>' : '') +
      '<h1 class="onb-title" tabindex="-1">' + esc(s.title) + '</h1>' +
      '<p class="onb-text">' + esc(s.text) + '</p>' +
      pick +
    '</div>' +
    dots +
    '<div class="onb-foot">' +
      '<button class="btn btn-primary btn-block" data-onb="next" ' + (nextDisabled ? 'aria-disabled="true"' : '') + '>' + esc(s.cta) + '</button>' +
    '</div>' +
  '</div>';
}
</script>

<script>
"use strict";
/* =====================================================================
   РЕНДЕР + ФОКУС + ПОДІЇ + СТАРТ
   ===================================================================== */

var _lastNav = null;
var _lastPoints = 0;
var _lastOnbStep = -1;
var _lastMenuCat = null;
var _lastWalletTab = null;
var _lastMapCity = null;
var _overlayReturn = null;
var _overlayJustOpened = false;
var _menuSearchT = 0;

/** Оновлення крапок герой-каруселі за прокруткою (перечіпляємо на кожному рендері) */
function wireHeroDots() {
  var hc = document.getElementById('heroCarousel');
  var dots = document.getElementById('heroDots');
  if (!hc || !dots) return;
  var upd = function () {
    var first = hc.firstElementChild;
    var step = first ? first.offsetWidth + 12 : hc.clientWidth;
    var i = step > 0 ? Math.round(hc.scrollLeft / step) : 0;
    i = Math.max(0, Math.min(dots.children.length - 1, i));
    for (var k = 0; k < dots.children.length; k++) dots.children[k].classList.toggle('on', k === i);
  };
  hc.addEventListener('scroll', upd, { passive: true });
}

function screenLabel() {
  return ({
    menu: 'Меню', map: 'Мапа точок', card: 'Картка лояльності',
    wallet: 'Бонуси', profile: 'Профіль', cart: 'Кошик',
    checkout: 'Оформлення замовлення', confirm: 'Замовлення прийнято'
  })[state.nav] || 'SHAUMAN';
}

function renderShell() {
  var shell = document.getElementById('shell');
  if (!shell) return;
  var navChanged = _lastNav !== state.nav;
  // зміна підрозділу в межах екрана (категорія меню / вкладка гаманця) —
  // теж повертаємо прокрутку на початок, як у справжньому застосунку
  var subViewChanged =
    (state.nav === 'menu' && _lastMenuCat !== state.menuCat) ||
    (state.nav === 'wallet' && _lastWalletTab !== state.walletTab) ||
    (state.nav === 'map' && _lastMapCity !== state.mapCity);
  var resetScroll = navChanged || subViewChanged;

  var prev = document.getElementById('screen');
  var prevScroll = prev ? prev.scrollTop : 0;
  // анімуємо появу лише при зміні розділу знизу, не при перемиканні категорій/вкладок —
  // тоді верхні панелі стоять непорушно, як у нативному застосунку
  var animate = navChanged && !prefersReducedMotion();

  var screenFn = screens[state.nav] || screens.menu;

  shell.innerHTML =
    topBarHTML() +
    '<main id="screen" tabindex="-1" aria-label="' + esc(screenLabel()) + '">' +
      '<div' + (animate ? ' class="screen-anim"' : '') + '>' + screenFn() + '</div>' +
    '</main>' +
    stickyCartHTML() +
    bottomNavHTML();

  var scr = document.getElementById('screen');
  if (scr) scr.scrollTop = resetScroll ? 0 : prevScroll;

  if (state.nav === 'menu') wireHeroDots();
  if (state.nav === 'map') wireMap();

  shell.setAttribute('aria-hidden', (_overlay || !state.onboarded) ? 'true' : 'false');

  if (state.points > _lastPoints) {
    var chip = document.getElementById('pointsChip');
    if (chip) chip.classList.add('bump');
  }
  _lastPoints = state.points;
  _lastNav = state.nav;
  _lastMenuCat = state.menuCat;
  _lastWalletTab = state.walletTab;
  _lastMapCity = state.mapCity;
}

function renderOverlay() {
  var host = document.getElementById('overlay');
  if (!host) return;
  host.innerHTML = overlayHTML();
  host.setAttribute('aria-hidden', _overlay ? 'false' : 'true');
  if (_overlay && _overlay.type === 'location') {
    wireSheetMap();
  } else if (_sheetMap) {
    try { _sheetMap.remove(); } catch (e) {}
    _sheetMap = null;
  }
}

function renderOnboarding() {
  var host = document.getElementById('onboarding');
  if (!host) return;
  var html = onboardingHTML();
  host.innerHTML = html;
  host.setAttribute('aria-hidden', html ? 'false' : 'true');
  if (html && _lastOnbStep !== _onbStep) {
    _lastOnbStep = _onbStep;
    var t = host.querySelector('.onb-title');
    if (t) t.focus({ preventScroll: true });
  }
  if (!html) _lastOnbStep = -1;
}

function applyTheme() {
  document.documentElement.setAttribute('data-app-theme', state.settings.theme === 'light' ? 'light' : 'dark');
}

function render() {
  state.nav = state.nav || 'menu';
  applyTheme();
  renderShell();
  renderOverlay();
  renderOnboarding();
  if (_overlay && _overlayJustOpened) {
    _overlayJustOpened = false;
    var f = document.querySelector('#overlay .sheet [autofocus], #overlay .sheet button, #overlay .sheet a[href], #overlay .sheet input');
    if (f) f.focus({ preventScroll: true });
  }
}

function focusScreen() {
  var el = document.getElementById('screen');
  if (el) el.focus({ preventScroll: true });
}

function openOverlay(ov) {
  _overlayReturn = document.activeElement;
  if (ov.type === 'item') ov.draft = { qty: 1, addonIds: [], sauceIds: [] };
  _overlay = ov;
  _overlayJustOpened = true;
  render();
}

function closeOverlay(skipRestore) {
  if (!_overlay) return;
  _overlay = null;
  render();
  if (!skipRestore && _overlayReturn && document.contains(_overlayReturn)) {
    _overlayReturn.focus({ preventScroll: true });
  }
  _overlayReturn = null;
}

function bumpCart() { /* фідбек дає ре-рендер стікі-кошика та степер у меню */ }

function toast(msg, kind) {
  var host = document.getElementById('toasts');
  if (!host) return;
  var el = document.createElement('div');
  el.className = 'toast' + (kind === 'accent' ? ' accent' : '');
  el.innerHTML = icon('check', 16) + '<span>' + esc(msg) + '</span>';
  host.appendChild(el);
  window.setTimeout(function () {
    el.style.transition = 'opacity .3s ease, transform .3s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 2600);
  while (host.children.length > 3) host.removeChild(host.firstChild);
}

/* ---- onboarding-обробник ---- */
function handleOnb(el) {
  var k = el.dataset.onb;
  if (k === 'skip') {
    actions.finishOnboarding({ fav: _onbDraft.fav || LOCATIONS[0].id, name: _onbDraft.name });
    return;
  }
  if (k === 'fav') {
    _onbDraft.fav = el.dataset.id;
    renderOnboarding();
    var host = document.getElementById('onboarding');
    var picks = host.querySelectorAll('[data-onb="fav"]');
    Array.prototype.forEach.call(picks, function (p) {
      p.setAttribute('data-checked', String(p.dataset.id === _onbDraft.fav));
    });
    var nb = host.querySelector('[data-onb="next"]');
    if (nb) nb.removeAttribute('aria-disabled');
    return;
  }
  if (k === 'name') return;
  if (k === 'next') {
    if (el.getAttribute('aria-disabled') === 'true') { toast('Оберіть точку, щоб продовжити'); return; }
    if (_onbStep < 2) { _onbStep += 1; renderOnboarding(); }
    else { actions.finishOnboarding({ fav: _onbDraft.fav, name: _onbDraft.name }); }
  }
}

/* ---- делегування подій ---- */
function wireEvents() {
  var root = document.getElementById('device');

  root.addEventListener('click', function (e) {
    var onb = e.target.closest('[data-onb]');
    if (onb) {
      if (onb.tagName === 'BUTTON') e.preventDefault();
      handleOnb(onb);
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.tagName === 'FORM') return;
    if (el.tagName === 'A' && (el.getAttribute('href') || '').charAt(0) === '#') e.preventDefault();
    var fn = actions[el.dataset.action];
    if (typeof fn === 'function') fn(el.dataset, e);
  });

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!e.target) return;
    if (e.target.id === 'nameForm') actions.saveName(e.target.dataset, e);
    else if (e.target.id === 'promoForm') actions.submitPromo(e.target.dataset, e);
  });

  root.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'menuSearch') {
      var v = t.value;
      var fld = t.closest('.ms-field');
      if (fld) fld.classList.toggle('has-val', !!v.trim());
      clearTimeout(_menuSearchT);
      _menuSearchT = window.setTimeout(function () {
        if (state.menuQuery === v) return;
        state.menuQuery = v;
        render();
        var el = document.getElementById('menuSearch');
        if (el) {
          el.focus({ preventScroll: true });
          try { el.setSelectionRange(el.value.length, el.value.length); } catch (err) {}
        }
      }, 200);
    }
    if (t.id === 'promoInput' && state.checkoutDraft) state.checkoutDraft.promoInput = t.value;
    if (t.id === 'onbName') _onbDraft.name = t.value;
    if (t.id === 'nameInput') {
      t.removeAttribute('aria-invalid');
      var er = document.getElementById('nameErr');
      if (er) er.textContent = '';
    }
    if (t.id === 'promoCode') {
      t.removeAttribute('aria-invalid');
      var pm = document.getElementById('promoMsg');
      if (pm) pm.textContent = '';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && _overlay) { e.preventDefault(); closeOverlay(); return; }
    if (e.key !== 'Tab') return;
    var scope = document.querySelector('#onboarding .onb') ||
      (_overlay ? document.querySelector('#overlay .sheet') : null);
    if (!scope) return;
    var nodes = scope.querySelectorAll('a[href], button, input, select, textarea, [tabindex]');
    var f = Array.prototype.filter.call(nodes, function (x) {
      return !x.disabled && x.getAttribute('aria-disabled') !== 'true' &&
        x.tabIndex !== -1 && x.offsetParent !== null;
    });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!scope.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  });
}

/* ---- годинник статус-бару ---- */
function tickClock() {
  var c = document.getElementById('clock');
  if (!c) return;
  var d = new Date();
  c.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

/* ---- старт ---- */
var _booted = false;
function boot() {
  if (_booted) return;
  _booted = true;
  loadState();
  _lastPoints = state.points;
  _lastNav = null;
  _lastMenuCat = null;
  _lastWalletTab = null;
  _lastMapCity = null;
  wireEvents();
  render();
  tickClock();
  window.setInterval(tickClock, 15000);
  window.setTimeout(function () { _menuLoading = false; render(); }, 700);
}

boot();
</script>
