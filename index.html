<!doctype html>
<html lang="uk">
<head>
<title>Шаумани</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />

<!--
  ШАУМАНИ — демо мобільного застосунку лояльності для мережі шаурми SHAUMAN (Познань).
  Один файл, без зовнішніх скриптів. Дизайн-код: Dark Industrial, кольори й шрифт
  підібрані під логотип (чорне коло, жовта кобра з короною, кутастий напис SHAUMAN):
  тепло-золотий акцент #F6CE05 (проба з логотипу ≈ #F8D808), майже чистий чорний фон,
  умовно-стиснений Oswald для заголовків/кнопок — під літери логотипа.

  Як застосовані скіли:
  - anti-ai-slop-ui: усі кольори/радіуси/відступи/таймінги — з токенів (CSS custom properties),
    один дизайн-код, окремі :hover/:active/:focus-visible, «хазард-стрічка» як фірмова деталь.
  - product-engineering-process: стани як discriminated unions (nav / checkout / game / order),
    без незалежних boolean-прапорців; оброблені гонки (подвійний клік «Оплатити»), збій оплати, перерив.
  - react-architecture-standards (адаптовано до vanilla): шар даних / стор / шар дій (actions) /
    чисті компоненти (state -> HTML) / рендер; 4 стани для кожного view (Loading/Empty/Error/Disabled).
  - qa-accessibility-standards: семантичний HTML, керування з клавіатури, focus-trap у шторках,
    видимий :focus-visible, контраст AA, валідація даних із localStorage (parseState як заміна Zod).
-->

<style>
  /* ================================ ТОКЕНИ ================================ */
  :root {
    /* Колір — підібрано під логотип: майже чистий чорний + тепле золото.
       Нейтралі мають легкий теплий (золотий) ухил, а не сірий «за замовчуванням». */
    --bg: #0a0906;           /* майже чорний, теплий ухил (проба чорного з лого ≈ #000) */
    --bg-elev: #100e0a;
    --surface: #17140e;
    --surface-2: #201c14;
    --surface-3: #2a251b;
    --text: #f7f3e8;         /* тепло-кремовий білий */
    --muted: #aba48f;        /* теплий сірий, AA на --bg (~8:1) */
    --faint: #8f8875;        /* лише для дрібних підписів; AA (>=4.5:1) і на --bg, і на --surface */
    --accent: #f6ce05;       /* SHAUMAN gold — проба з логотипа ≈ #F8D808, скоригована від JPEG-зелені */
    --accent-bright: #ffde3d;/* блиск: під найсвітліші пікселі логотипа */
    --accent-press: #dbb300;
    --accent-ink: #f6ce05;   /* золото, безпечне як ТЕКСТ на поточному тлі (у світлій темі темніше) */
    --on-accent: #17140a;    /* тепле майже-чорне на золоті, контраст ~12:1 */
    --border: #332d20;       /* теплий */
    --line: #16130d;         /* декоративна сітка, ледь помітна */
    --logo-url: url("./img/logo.jpg");

    /* Семантика — окремо від акценту */
    --ok: #63d07a;
    --warn: #f5a524;
    --crit: #ff5c5c;
    --info: #56a3f0;

    /* Рідкісність шауманчіків */
    --r-common: #aba48f;
    --r-rare: #56a3f0;
    --r-epic: #43d8c4;
    --r-legendary: #f5a524;
    --r-mythic: #f6ce05;

    /* Радіуси — шкала, гострі грані (industrial) */
    --r-xs: 2px;
    --r-sm: 4px;
    --r-md: 8px;
    --r-pill: 999px;

    /* Відступи */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;

    /* Рух */
    --e-out: cubic-bezier(0.16, 1, 0.3, 1);
    --e-sharp: cubic-bezier(0.2, 0.8, 0.2, 1);
    --t-micro: 130ms;
    --t-base: 240ms;
    --t-layout: 400ms;

    /* Шрифти — умовно-стиснений Oswald під кутастий напис логотипа */
    --font-display: "Oswald", "Arial Narrow", system-ui, sans-serif;
    --font-body: "Manrope", system-ui, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

    /* Фірмова тінь/сяйво — лише для акцентних елементів (золото з логотипа) */
    --glow: 0 0 0 1px rgba(246, 206, 5, 0.30), 0 10px 30px -10px rgba(246, 206, 5, 0.34);
    --card-shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 12px 28px -18px rgba(0, 0, 0, 0.85);

    --app-h: 100dvh;
    --type-scale: 15px;
  }

  /* Світла тема — теплий кремовий папір. Перевизначаємо лише токени. */
  :root[data-app-theme="light"] {
    --bg: #f6f4ee;
    --bg-elev: #fffdf7;
    --surface: #fffdf7;
    --surface-2: #efeadd;
    --surface-3: #e5dfcd;
    --text: #1c1a13;
    --muted: #6a6455;
    --faint: #8a8471;
    --accent: #f6ce05;
    --accent-bright: #ffd733;
    --accent-press: #e0b800;
    --accent-ink: #7a6000;   /* темне золото як текст на кремі — AA */
    --on-accent: #1c1a13;
    --border: #ddd6c4;
    --line: #e8e3d4;
    --ok: #2f9e57;
    --warn: #c47a12;
    --crit: #d64545;
    --info: #2f74c9;
    --r-common: #6a6455;
    --r-rare: #2f74c9;
    --r-epic: #158f80;
    --r-legendary: #c47a12;
    --r-mythic: #a37f00;
    --glow: 0 0 0 1px rgba(246, 206, 5, 0.55), 0 10px 26px -12px rgba(180, 140, 0, 0.4);
    --card-shadow: 0 1px 2px rgba(28, 26, 19, 0.06), 0 14px 30px -20px rgba(28, 26, 19, 0.22);
  }
  /* На світлому тлі blend прибирати не треба — просто кругла обрізка */
  :root[data-app-theme="light"] .logo-img { mix-blend-mode: normal; }
  /* Декоративна сітка навколо «пристрою» у світлій темі — ледь тепліша */
  :root[data-app-theme="light"] { background-color: var(--bg); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-body);
    font-size: var(--type-scale);
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;               /* прокручується лише #screen усередині */
  }

  /* Фон сторінки навколо «пристрою» — індустріальна сітка */
  #page {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: var(--bg);
    overflow: hidden;
  }

  @media (min-width: 520px) {
    #page {
      padding: var(--s-6) var(--s-4);
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 44px 44px;
    }
  }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  ul, ol { list-style: none; }
  img, svg { display: block; max-width: 100%; }
  input, select, textarea { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-xs);
  }

  ::selection { background: var(--accent); color: var(--on-accent); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ============================== КАРКАС ============================== */
  #device {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: var(--app-h);
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
    isolation: isolate;
  }

  @media (min-width: 520px) {
    :root { --app-h: min(924px, calc(100dvh - 64px)); }
    #device {
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--card-shadow), 0 0 0 1px rgba(255, 255, 255, 0.02);
    }
  }

  .statusbar {
    flex: none;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--s-5);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--text);
    background: var(--bg);
  }
  .statusbar .sb-right { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { width: 15px; height: 15px; }

  .topbar {
    flex: none;
    height: 54px;
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: 0 var(--s-4);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  /* Логотип у шапці */
  .brand-lockup {
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  /* Логотип: один вбудований файл (--logo-url), lighten прибирає чорне тло лого */
  .logo-img {
    display: inline-block;
    background: var(--logo-url) center / cover no-repeat;
    mix-blend-mode: lighten;
    flex: none;
  }
  .brand-logo {
    width: 30px;
    height: 30px;
    border-radius: var(--r-pill);
  }
  .brand-word {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    color: var(--text);
  }

  @keyframes chip-bump {
    0% { transform: scale(1); }
    35% { transform: scale(1.13); box-shadow: var(--glow); }
    100% { transform: scale(1); }
  }

  /* Оболонка між статус-баром і краями пристрою: топбар зверху, нав знизу,
     а посередині — єдина зона прокрутки #screen. */
  #shell {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  #screen {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #screen::-webkit-scrollbar { width: 6px; }
  #screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--r-pill); }

  .screen-anim { animation: screen-in var(--t-base) var(--e-out); }
  @keyframes screen-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============================== BOTTOM NAV ============================== */
  .bottomnav {
    flex: none;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: end;
    padding: 8px var(--s-3) calc(8px + env(safe-area-inset-bottom));
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
  }
  .navbtn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 1px;
    min-width: 0;
    min-height: 48px;
    color: var(--faint);
    border-radius: var(--r-sm);
    transition: color var(--t-micro) var(--e-sharp);
  }
  .navbtn svg { width: 22px; height: 22px; }
  .navbtn span {
    font-family: var(--font-display); font-size: 10px; font-weight: 500;
    letter-spacing: 0.02em; text-transform: uppercase;
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .navbtn:hover { color: var(--muted); }
  .navbtn[aria-current="page"] { color: var(--accent-ink); }
  /* Центральна кнопка — піднятий сканер; баланс шауманів окремим підписом ПІД нею,
     на одній лінії з підписами «Меню/Мапа/…». Кнопка позиціонується абсолютно. */
  .navbtn.center { position: relative; overflow: visible; }
  .navbtn.center .cnb-box {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: 52px;
    height: 52px;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: var(--r-md);
    display: grid;
    place-items: center;
    box-shadow: var(--glow);
    transition: box-shadow var(--t-base) var(--e-out);
  }
  .navbtn.center .cnb-frame { width: 28px; height: 28px; color: var(--on-accent); }
  .navbtn.center .cnb-frame svg { width: 100%; height: 100%; }
  .navbtn.center .cnb-label {
    margin-top: auto;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11.5px;
    color: var(--accent-ink);
    white-space: nowrap;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }
  .navbtn.center .cnb-label i {
    font-style: normal;
    font-size: 0.66em;
    font-weight: 700;
    letter-spacing: 0.12em;
    vertical-align: 0.42em;
    opacity: 0.55;
    margin-left: 3px;
  }
  .navbtn.center:hover .cnb-box { box-shadow: var(--glow), 0 0 0 3px rgba(246, 206, 5, 0.18); }
  .navbtn.center:active .cnb-box { transform: translateX(-50%) scale(0.94); }
  .navbtn.center.bump .cnb-box { animation: cnb-bump 520ms var(--e-out); }
  @keyframes cnb-bump {
    0% { transform: translateX(-50%) scale(1); }
    35% { transform: translateX(-50%) scale(1.13); box-shadow: var(--glow); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* ============================== STICKY CART ============================== */
  .sticky-cart {
    flex: none;
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: 10px var(--s-4);
    background: var(--accent);
    color: var(--on-accent);
    border-top: 1px solid var(--accent-press);
  }
  .sticky-cart .sc-count {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 12px;
    background: var(--on-accent);
    color: var(--accent-ink);
    padding: 3px 7px;
    border-radius: var(--r-xs);
  }
  .sticky-cart .sc-label { font-weight: 700; font-size: 13px; }
  .sticky-cart .sc-total { margin-left: auto; font-family: var(--font-mono); font-weight: 600; }
  .sticky-cart .sc-go {
    display: inline-flex; align-items: center; gap: 4px;
    font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .sticky-cart .sc-go svg { width: 16px; height: 16px; }
  .sticky-cart:active { background: var(--accent-press); }

  /* ============================== ТИПОГРАФІКА / БЛОКИ ============================== */
  .screen-pad { padding: var(--s-5) var(--s-4) var(--s-6); }

  .h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.06;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .eyebrow {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-ink);
  }
  .muted { color: var(--muted); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Хазард-стрічка — фірмовий розділювач */
  .hazard {
    height: 10px;
    background-image: repeating-linear-gradient(
      -45deg,
      var(--accent) 0 12px,
      var(--on-accent) 12px 24px
    );
    opacity: 0.9;
  }

  /* ============================== КНОПКИ ============================== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--s-2);
    min-height: 48px;
    padding: 0 var(--s-5);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-radius: var(--r-sm);
    transition: transform var(--t-micro) var(--e-sharp), background var(--t-micro) var(--e-sharp),
      border-color var(--t-micro) var(--e-sharp), box-shadow var(--t-base) var(--e-out), opacity var(--t-micro) linear;
  }
  .btn svg { width: 18px; height: 18px; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { box-shadow: var(--glow); }
  .btn-primary:active { transform: scale(0.98); background: var(--accent-press); }
  .btn-ghost { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
  .btn-ghost:hover { border-color: var(--faint); background: var(--surface-2); }
  .btn-ghost:active { transform: scale(0.98); }
  .btn-block { display: flex; width: 100%; }
  .btn[aria-disabled="true"] {
    opacity: 0.42;
    cursor: not-allowed;
    pointer-events: none;
    box-shadow: none;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 34px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    color: var(--muted);
    transition: color var(--t-micro), border-color var(--t-micro), background var(--t-micro);
  }
  .chip:hover { border-color: var(--faint); color: var(--text); }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent-ink);
    color: var(--on-accent);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: var(--r-xs);
    border: 1px solid currentColor;
  }
  .tag.hit { color: var(--accent-ink); }
  .tag.spicy { color: var(--crit); }
  .tag.xl { color: var(--warn); }
  .tag.veg { color: var(--ok); }
  .tag.new { color: var(--info); }

  /* ============================== КАРТКИ МЕНЮ ============================== */
  .pickup-strip {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 10px var(--s-4);
    font-size: 12px;
    color: var(--muted);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    transition: background var(--t-micro) var(--e-sharp);
  }
  .pickup-strip:hover { background: var(--surface); }
  .pickup-strip:active { background: var(--surface-2); }
  .pickup-strip > svg { width: 14px; height: 14px; flex: none; color: var(--accent-ink); }
  .pickup-strip .ps-loc { color: var(--text); font-weight: 600; white-space: nowrap; }
  .pickup-strip .ps-loc::before,
  .pickup-strip .ps-status::before { content: "·"; margin-right: 6px; color: var(--faint); }
  .pickup-strip .ps-status { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pickup-strip .ps-arrow { margin-left: auto; color: var(--faint); flex: none; }
  .pickup-strip .ps-arrow svg { width: 14px; height: 14px; }

  .cat-scroll {
    display: flex;
    gap: var(--s-2);
    overflow-x: auto;
    padding: var(--s-3) var(--s-4);
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }
  .cat-scroll::-webkit-scrollbar { display: none; }

  .menu-list { display: flex; flex-direction: column; }
  .menu-item {
    display: grid;
    grid-template-columns: 76px 1fr auto;
    gap: var(--s-3);
    align-items: center;
    width: 100%;
    text-align: left;
    padding: var(--s-4);
    border-bottom: 1px solid var(--border);
    transition: background var(--t-micro) var(--e-sharp);
  }
  .menu-item:hover { background: var(--surface); }
  .menu-item:active { background: var(--surface-2); }
  .menu-thumb {
    width: 76px;
    height: 76px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    overflow: hidden;
    flex: none;
  }
  .menu-thumb svg { width: 100%; height: 100%; }
  .food-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
  .menu-item .mi-name { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .menu-item .mi-desc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .menu-item .mi-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .menu-item .mi-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .menu-item .mi-price { font-family: var(--font-mono); font-weight: 600; font-size: 14px; }
  .mi-add {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: var(--r-xs);
    transition: transform var(--t-micro) var(--e-sharp);
  }
  .mi-add svg { width: 16px; height: 16px; }
  .mi-add:active { transform: scale(0.9); }
  .mi-qty {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-weight: 600; font-size: 13px;
  }
  .mi-qty button {
    width: 30px; height: 30px; display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: var(--r-xs); color: var(--text);
    transition: border-color var(--t-micro), background var(--t-micro);
  }
  .mi-qty button:hover { border-color: var(--accent-ink); }
  .mi-qty button:active { background: var(--surface-2); }

  /* ============================== СКЕЛЕТОНИ ============================== */
  .skel {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%);
    background-size: 400% 100%;
    animation: skel 1.4s ease infinite;
    border-radius: var(--r-xs);
  }
  @keyframes skel { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .skel-row {
    display: grid; grid-template-columns: 76px 1fr; gap: var(--s-3);
    padding: var(--s-4); border-bottom: 1px solid var(--border);
  }

  /* ============================== EMPTY / ERROR ============================== */
  .state-box {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: var(--s-4); padding: var(--s-7) var(--s-5);
  }
  .state-box .sb-mark { width: 72px; height: 72px; opacity: 0.5; }
  .state-box .sb-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
  .state-box .sb-text { color: var(--muted); font-size: 13px; max-width: 34ch; }

  /* ============================== ГАМАНЕЦЬ / КАРТКА ============================== */
  .loyalty-card {
    position: relative;
    margin: var(--s-4);
    padding: var(--s-5);
    border: 1px solid var(--accent);
    border-radius: var(--r-md);
    background:
      radial-gradient(120% 100% at 100% 0%, rgba(246, 206, 5, 0.12), transparent 60%),
      var(--bg-elev);
    box-shadow: var(--glow);
    overflow: hidden;
  }
  .loyalty-card .lc-mark {
    position: absolute; right: -28px; bottom: -32px; width: 168px; height: 168px;
    border-radius: var(--r-pill);
    opacity: 0.16; mix-blend-mode: lighten; pointer-events: none;
  }
  .loyalty-card .lc-tier { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-ink); }
  .loyalty-card .lc-name { font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.01em; margin-top: 4px; }
  .loyalty-card .lc-balance { font-family: var(--font-mono); font-weight: 600; font-size: 40px; line-height: 1; margin-top: var(--s-4); }
  .loyalty-card .lc-balance small { font-size: 14px; color: var(--muted); font-weight: 400; }

  .progress {
    height: 8px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-pill); overflow: hidden; margin-top: var(--s-4);
  }
  .progress > i { display: block; height: 100%; background: var(--accent); transition: width var(--t-layout) var(--e-out); }

  .code-card {
    margin: var(--s-4); padding: var(--s-5);
    background: var(--text); color: var(--on-accent);
    border-radius: var(--r-md); text-align: center;
  }
  .code-card .cc-hint { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #55554e; }
  .barcode { display: flex; gap: 2px; justify-content: center; align-items: flex-end; height: 66px; margin: var(--s-4) 0; }
  .barcode > i { width: 3px; background: var(--on-accent); }
  .qr-grid {
    width: 132px; height: 132px; margin: 0 auto var(--s-3);
    display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
    gap: 2px;
  }
  .qr-grid > i { background: var(--on-accent); border-radius: 1px; }
  .qr-grid > i.off { background: transparent; }
  .code-card .cc-num { font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.2em; }

  /* Розділи гаманця: Колекція (головне) + Нагороди / Історія поруч */
  .wallet-chips {
    display: flex; gap: var(--s-2); padding: 0 var(--s-4) var(--s-4);
    border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .wallet-chips::-webkit-scrollbar { display: none; }
  .wallet-chips .chip { font-family: var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
  .wallet-chips .chip svg { width: 14px; height: 14px; }

  /* Чек покупки */
  .receipt {
    border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--surface); padding: 14px; margin-bottom: 12px;
  }
  .receipt .rc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .receipt .rc-date { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: lowercase; }
  .receipt .rc-total { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .receipt .rc-loc {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); margin: 8px 0 10px;
  }
  .receipt .rc-loc svg { width: 13px; height: 13px; color: var(--accent-ink); flex: none; }
  .receipt .rc-items {
    border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border);
    padding: 9px 0; display: flex; flex-direction: column; gap: 5px;
  }
  .receipt .rc-line { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .receipt .rc-line span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .receipt .rc-line.rc-sub { font-size: 11px; color: var(--muted); padding-left: 14px; }
  .receipt .rc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .receipt .rc-num { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .receipt .rc-pts { font-size: 12px; color: var(--accent-ink); font-weight: 600; }

  /* ============================== REWARDS ============================== */
  .reward-card {
    display: grid; grid-template-columns: 44px 1fr auto; gap: var(--s-3); align-items: center;
    width: 100%; text-align: left;
    padding: var(--s-4); border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--surface); margin-bottom: var(--s-3);
    transition: border-color var(--t-micro), background var(--t-micro);
  }
  .reward-card:hover { border-color: var(--faint); }
  .reward-card .rc-ic { width: 44px; height: 44px; display: grid; place-items: center; background: var(--surface-2); border-radius: var(--r-sm); color: var(--accent-ink); }
  .reward-card .rc-ic svg { width: 22px; height: 22px; }
  .reward-card .rc-name { display: block; font-weight: 700; font-size: 13px; }
  .reward-card .rc-cost { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 3px; }
  .reward-card .rc-cta { font-family: var(--font-mono); font-weight: 600; font-size: 12px; color: var(--accent-ink); }
  .reward-card[aria-disabled="true"] { opacity: 0.5; }
  .reward-card[aria-disabled="true"] .rc-cta { color: var(--faint); }

  .coupon-row {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-3) var(--s-4); border: 1px dashed var(--accent); border-radius: var(--r-sm);
    background: rgba(246, 206, 5, 0.06); margin-bottom: var(--s-3);
  }
  .coupon-row .cr-code { font-family: var(--font-mono); font-weight: 600; color: var(--accent-ink); font-size: 12px; }
  .coupon-row .cr-label { font-size: 13px; }

  /* ============================== ШАУМАНЧІКИ ============================== */
  .cobra-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); padding: var(--s-4);
  }
  .cobra-cell {
    position: relative;
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--surface);
    overflow: hidden;
    transition: border-color var(--t-micro), transform var(--t-micro) var(--e-sharp);
  }
  .cobra-cell:hover { border-color: var(--faint); }
  .cobra-cell:active { transform: scale(0.97); }
  .cobra-cell svg { width: 100%; height: 100%; }
  .cobra-cell.locked svg { filter: grayscale(1) brightness(0.32); }
  .cobra-cell .cc-lock {
    position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint);
  }
  .cobra-cell .cc-lock svg { width: 22px; height: 22px; }
  .cobra-cell .cc-rar {
    position: absolute; left: 4px; bottom: 4px; width: 8px; height: 8px; border-radius: var(--r-pill);
  }
  .rar-common { background: var(--r-common); }
  .rar-rare { background: var(--r-rare); }
  .rar-epic { background: var(--r-epic); }
  .rar-legendary { background: var(--r-legendary); }
  .rar-mythic { background: var(--r-mythic); box-shadow: 0 0 8px var(--r-mythic); }

  /* ============================== МАПА ============================== */
  /* Вибір міста — сегментна панель, легкодоступна вгорі */
  .city-seg {
    display: flex; gap: 4px;
    margin: var(--s-4) var(--s-4) var(--s-3);
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
  }
  .city-seg button {
    flex: 1;
    min-width: 0;
    min-height: 38px;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--muted);
    border-radius: var(--r-xs);
    transition: color var(--t-micro) var(--e-sharp), background var(--t-micro) var(--e-sharp);
  }
  .city-seg button:hover { color: var(--text); }
  .city-seg button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
  }

  /* Супутниковий знімок з реальною картою */
  .sat-wrap {
    display: block;
    position: relative;
    margin: 0 var(--s-4) var(--s-3);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--bg-elev);
    aspect-ratio: 16 / 10;
  }
  .sat-hit {
    position: absolute; inset: 0; z-index: 3;
    background: transparent;
    transition: box-shadow var(--t-micro) var(--e-sharp), background var(--t-micro) var(--e-sharp);
  }
  .sat-hit:hover { box-shadow: inset 0 0 0 2px var(--faint); }
  .sat-hit:active { background: rgba(0, 0, 0, 0.12); }
  .sat-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
  }
  .sat-wrap::after {
    /* легка віньєтка, щоб знімок не сперечався з UI */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(10, 9, 6, 0.55) 100%);
  }
  .sat-pin {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -100%);
    z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.7));
  }
  .sat-pin svg { width: 34px; height: 34px; color: var(--accent-ink); }
  .sat-pin[data-open="closed"] svg { color: var(--text); }
  .sat-label {
    position: absolute; left: 10px; bottom: 8px; z-index: 2;
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-display); font-weight: 600; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text);
    background: rgba(10, 9, 6, 0.62);
    border: 1px solid var(--border);
    border-radius: var(--r-xs);
    padding: 5px 9px;
    max-width: calc(100% - 20px);
  }
  .sat-label .sd { width: 7px; height: 7px; border-radius: var(--r-pill); flex: none; }
  .sat-attr {
    position: absolute; right: 6px; top: 6px; z-index: 2;
    font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.02em;
    color: rgba(244, 243, 232, 0.72);
    background: rgba(10, 9, 6, 0.5);
    padding: 1px 5px; border-radius: var(--r-xs);
  }

  /* Огляд «Уся Польща» */
  .poland-wrap {
    display: block; position: relative;
    margin: 0 var(--s-4) var(--s-3);
    border: 1px solid var(--border); border-radius: var(--r-md);
    overflow: hidden; background: var(--bg-elev);
    aspect-ratio: 68 / 46;
  }
  .poland-img { position: absolute; inset: 0; width: 100%; height: 100%; background-size: cover; background-position: center; }
  .poland-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(130% 100% at 38% 30%, transparent 45%, rgba(10, 9, 6, 0.5) 100%);
  }
  :root[data-app-theme="light"] .poland-wrap::after {
    background: radial-gradient(130% 100% at 38% 30%, transparent 60%, rgba(28, 26, 19, 0.1) 100%);
  }
  .pl-pin {
    position: absolute; transform: translate(-50%, -50%); z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--accent);
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    transition: transform var(--t-micro) var(--e-sharp);
  }
  .pl-pin:hover { transform: translate(-50%, -50%) scale(1.08); }
  .pl-pin:active { transform: translate(-50%, -50%) scale(0.95); }
  .pl-pin > svg { width: 24px; height: 24px; }
  .pl-pin .pl-name {
    font-family: var(--font-display); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap;
    color: var(--text);
    background: rgba(10, 9, 6, 0.72); border: 1px solid var(--border);
    border-radius: var(--r-xs); padding: 1px 5px;
  }
  :root[data-app-theme="light"] .pl-pin .pl-name { background: rgba(255, 253, 247, 0.9); }

  .city-group-label {
    font-family: var(--font-display); font-size: 12px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    padding: 18px 16px 6px; display: flex; align-items: center; gap: 10px;
  }
  .city-group-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .loc-card {
    display: block; width: 100%; text-align: left;
    padding: var(--s-4); border-bottom: 1px solid var(--border);
    border-left: 2px solid transparent;
    transition: background var(--t-micro), border-color var(--t-micro);
  }
  .loc-card:hover { background: var(--surface); }
  .loc-card:active { background: var(--surface-2); }
  .loc-card.is-focused { border-left-color: var(--accent-ink); background: var(--surface); }
  .loc-card .lc-top { display: flex; align-items: center; gap: var(--s-2); }
  .loc-card .lc-addr { font-weight: 700; font-size: 14px; }
  .loc-card .lc-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .status-dot { width: 8px; height: 8px; border-radius: var(--r-pill); flex: none; }
  .status-dot.open { background: var(--ok); }
  .status-dot.soon { background: var(--warn); }
  .status-dot.closed { background: var(--crit); }
  .status-txt.open { color: var(--ok); }
  .status-txt.soon { color: var(--warn); }
  .status-txt.closed { color: var(--crit); }
  .fav-star { margin-left: auto; color: var(--faint); }
  .fav-star.on { color: var(--accent-ink); }
  .fav-star svg { width: 18px; height: 18px; }

  /* ============================== КОШИК / ЧЕКАУТ ============================== */
  .line-item {
    display: grid; grid-template-columns: 56px 1fr auto; gap: var(--s-3);
    padding: var(--s-4); border-bottom: 1px solid var(--border);
  }
  .line-item .li-thumb { width: 56px; height: 56px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); overflow: hidden; }
  .line-item .li-name { font-weight: 700; font-size: 13px; }
  .line-item .li-add { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .line-item .li-price { font-family: var(--font-mono); font-weight: 600; font-size: 13px; text-align: right; }
  .line-item .li-rm { font-size: 11px; color: var(--faint); margin-top: 6px; }
  .line-item .li-rm:hover { color: var(--crit); }

  .summary { padding: var(--s-4); }
  .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .summary-row.total { border-top: 1px solid var(--border); margin-top: var(--s-2); padding-top: var(--s-3); font-weight: 800; font-size: 16px; }
  .summary-row .mono { color: var(--text); }
  .summary-row.earn { color: var(--accent-ink); font-family: var(--font-mono); font-size: 12px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--s-4); }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input, .field select {
    min-height: 46px; padding: 0 var(--s-3);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
    transition: border-color var(--t-micro);
  }
  .field input:focus, .field select:focus { border-color: var(--accent-ink); outline: none; }
  .field input[aria-invalid="true"] { border-color: var(--crit); }
  .field .err { font-size: 12px; color: var(--crit); }

  .radio-list { display: flex; flex-direction: column; gap: var(--s-2); }
  .radio-opt {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-3) var(--s-4); border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--surface); transition: border-color var(--t-micro), background var(--t-micro);
  }
  .radio-opt:hover { border-color: var(--faint); }
  .radio-opt[data-checked="true"] { border-color: var(--accent-ink); background: rgba(246, 206, 5, 0.06); }
  .radio-opt .ro-mark {
    width: 18px; height: 18px; border-radius: var(--r-pill); border: 2px solid var(--border); flex: none;
    display: grid; place-items: center;
  }
  .radio-opt[data-checked="true"] .ro-mark { border-color: var(--accent-ink); }
  .radio-opt[data-checked="true"] .ro-mark::after { content: ""; width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--accent); }
  .radio-opt .ro-body { flex: 1; }
  .radio-opt .ro-name { font-size: 13px; font-weight: 600; }
  .radio-opt .ro-sub { font-size: 11px; color: var(--muted); }

  .helper-note {
    display: flex; align-items: flex-start; gap: var(--s-2);
    font-size: 12px; color: var(--muted); padding: var(--s-3) var(--s-4);
    background: var(--surface); border-left: 2px solid var(--warn); margin: 0 var(--s-4) var(--s-4);
  }
  .helper-note svg { width: 14px; height: 14px; flex: none; margin-top: 2px; color: var(--warn); }

  /* ============================== ШТОРКА / МОДАЛ ============================== */
  #overlay {
    position: absolute; inset: 0; z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
    pointer-events: none;
  }
  #overlay .backdrop {
    position: absolute; inset: 0; background: rgba(4, 4, 5, 0.72);
    pointer-events: auto;
    animation: fade-in var(--t-base) ease;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .sheet {
    position: relative;
    width: 100%;
    max-width: 430px;
    max-height: 88%;
    display: flex;
    flex-direction: column;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--r-md) var(--r-md) 0 0;
    pointer-events: auto;
    overflow: hidden;
    animation: sheet-up var(--t-layout) var(--e-out);
  }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-grip { width: 36px; height: 4px; background: var(--border); border-radius: var(--r-pill); margin: 10px auto 0; flex: none; }
  .sheet-head {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--border);
  }
  .sheet-head .sh-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
  .sheet-close {
    margin-left: auto; width: 34px; height: 34px; display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: var(--r-xs); color: var(--muted);
    transition: border-color var(--t-micro), color var(--t-micro);
  }
  .sheet-close:hover { color: var(--text); border-color: var(--faint); }
  .sheet-body { overflow-y: auto; padding: var(--s-4); }
  .sheet-foot { padding: var(--s-4); border-top: 1px solid var(--border); background: var(--bg-elev); }

  .sheet-hero {
    height: 190px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
    display: grid; place-items: center; margin-bottom: var(--s-4); overflow: hidden;
  }
  .sheet-hero svg { height: 110px; width: auto; }
  .sheet-hero .food-photo { height: 100%; }

  /* кастомізація позиції (соус / добавки) — стиль «як у великих застосунків» */
  .cz-block { margin-top: 16px; }
  .cz-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .cz-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .cz-note { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .sauce-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .sauce-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; font-weight: 600; color: var(--text);
    padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-pill);
    background: var(--surface); transition: border-color var(--t-micro), background var(--t-micro);
  }
  .sauce-chip svg { width: 12px; height: 12px; }
  .sauce-chip:hover { border-color: var(--faint); }
  .sauce-chip[data-on="1"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .addon-list { display: grid; gap: 8px; }
  .addon-opt {
    display: flex; align-items: center; gap: var(--s-3);
    padding: 11px var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md);
    background: var(--surface); transition: border-color var(--t-micro), background var(--t-micro);
  }
  .addon-opt:hover { border-color: var(--faint); }
  .addon-opt[data-checked="true"] { border-color: var(--accent-ink); background: rgba(246, 206, 5, 0.06); }
  .addon-opt .ao-box {
    width: 22px; height: 22px; border: 2px solid var(--border); border-radius: var(--r-sm); flex: none;
    display: grid; place-items: center; color: var(--faint);
  }
  .addon-opt[data-checked="true"] .ao-box { background: var(--accent); border-color: var(--accent-ink); color: var(--on-accent); }
  .addon-opt .ao-box svg { width: 12px; height: 12px; }
  .addon-opt .ao-name { font-size: 13.5px; flex: 1; }
  .addon-opt .ao-price { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

  .qty-stepper {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--s-3) 0;
  }
  .qty-stepper .qs-ctrl { display: inline-flex; align-items: center; gap: var(--s-4); }
  .qty-stepper button {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: var(--r-xs); color: var(--text);
    transition: border-color var(--t-micro);
  }
  .qty-stepper button:hover { border-color: var(--accent-ink); }
  .qty-stepper .qs-val { font-family: var(--font-mono); font-weight: 600; font-size: 18px; min-width: 24px; text-align: center; }

  /* ============================== КОЛЕСО ОДЕСИ ============================== */
  .wheel-stage { display: flex; flex-direction: column; align-items: center; gap: var(--s-4); padding: var(--s-5) var(--s-4); }
  .wheel-outer { position: relative; width: 260px; height: 260px; }
  .wheel-pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
    border-top: 20px solid var(--accent); z-index: 3;
  }
  .wheel {
    width: 100%; height: 100%; border-radius: var(--r-pill);
    border: 3px solid var(--accent);
    transition: transform 3.4s cubic-bezier(0.16, 0.9, 0.25, 1);
  }
  .wheel-hub {
    position: absolute; inset: 0; margin: auto; width: 56px; height: 56px;
    background: var(--bg); border: 2px solid var(--accent); border-radius: var(--r-pill);
    display: grid; place-items: center; z-index: 2;
  }
  .wheel-hub svg { width: 34px; height: 34px; color: var(--accent-ink); }
  .prize-reveal { text-align: center; padding: var(--s-5) var(--s-4); }
  .prize-reveal .pr-mark { width: 90px; height: 90px; margin: 0 auto var(--s-4); color: var(--accent-ink); }
  .prize-reveal .pr-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.02em; }
  .prize-reveal .pr-sub { color: var(--muted); font-size: 13px; margin-top: var(--s-2); }

  .scratch {
    position: relative; width: 220px; height: 220px; margin: 0 auto var(--s-4);
    border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden;
  }
  .scratch .sc-prize { position: absolute; inset: 0; display: grid; place-items: center; background: var(--surface); }
  .scratch .sc-prize svg { width: 78%; height: 78%; }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .scratch .sc-hint {
    position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
    font-family: var(--font-mono); font-size: 10px; color: var(--on-accent); pointer-events: none;
  }

  /* ============================== ONBOARDING ============================== */
  .onb {
    position: absolute; inset: 0; z-index: 60; background: var(--bg);
    display: flex; flex-direction: column;
  }
  .onb-skip { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 16px; font-size: 12px; color: var(--muted); z-index: 2; }
  .onb-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: safe center; padding: var(--s-6) var(--s-5); gap: var(--s-4); }
  .onb-body::-webkit-scrollbar { width: 0; }
  .onb-logo {
    width: 132px; height: 132px; border-radius: var(--r-pill);
    border: 1px solid var(--border);
  }
  .onb-mark { width: 120px; height: 120px; color: var(--accent-ink); }
  .confirm-logo {
    width: 96px; height: 96px; border-radius: var(--r-pill); margin: 0 auto var(--s-2);
    border: 1px solid var(--border);
  }
  .onb-title { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.02; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
  .onb-text { color: var(--muted); font-size: 14px; max-width: 34ch; }
  .onb-dots { display: flex; gap: 6px; padding: 0 var(--s-5) var(--s-3); }
  .onb-dots > i { width: 22px; height: 3px; background: var(--border); border-radius: var(--r-pill); }
  .onb-dots > i.on { background: var(--accent); }
  .onb-foot { padding: var(--s-4) var(--s-5) calc(var(--s-5) + env(safe-area-inset-bottom)); }

  /* ============================== TOASTS ============================== */
  #toasts {
    position: absolute; left: 0; right: 0; bottom: 92px; z-index: 80;
    display: flex; flex-direction: column; align-items: center; gap: var(--s-2);
    pointer-events: none; padding: 0 var(--s-4);
  }
  .toast {
    display: flex; align-items: center; gap: var(--s-2);
    background: var(--text); color: var(--on-accent);
    padding: 10px var(--s-4); border-radius: var(--r-sm);
    font-size: 13px; font-weight: 600; max-width: 100%;
    box-shadow: var(--card-shadow);
    animation: toast-in var(--t-base) var(--e-out);
  }
  .toast svg { width: 16px; height: 16px; flex: none; }
  .toast.accent { background: var(--accent); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ============================== ІНШЕ ============================== */
  .link-row {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-4); border-bottom: 1px solid var(--border);
    transition: background var(--t-micro);
  }
  .link-row:hover { background: var(--surface); }
  .link-row svg:first-child { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .link-row .lr-text { font-size: 13px; font-weight: 600; }
  .link-row .lr-sub { font-size: 11px; color: var(--faint); }
  .link-row .lr-arrow { margin-left: auto; color: var(--faint); }
  .link-row .lr-arrow svg { width: 16px; height: 16px; }
  .link-row[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }

  .section-label {
    font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    padding: var(--s-5) var(--s-4) var(--s-2);
  }

  .demo-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--faint); padding: 4px 8px; border: 1px dashed var(--border); border-radius: var(--r-xs);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  /* ============================================================================
     МЕНЮ 2.0 — редизайн головного екрана (розкладка як у фуд-аппах, айдентика лишається)
     ============================================================================ */
  :root { --r-lg: 14px; --r-xl: 20px;
    --shadow-card: 0 2px 8px rgba(0,0,0,.35), 0 16px 34px -18px rgba(0,0,0,.7); }
  :root[data-app-theme="light"] { --shadow-card: 0 2px 8px rgba(28,26,19,.06), 0 16px 34px -20px rgba(28,26,19,.18); }

  /* --- шапка: іконка / лого по центру / кошик з лічильником --- */
  .topbar {
    display: grid;
    grid-template-columns: 40px 1fr 40px;
    gap: 0;
  }
  .topbar .brand-lockup { justify-self: center; }
  .tb-icon {
    width: 40px; height: 40px; display: grid; place-items: center;
    border-radius: var(--r-pill); color: var(--muted);
    transition: color var(--t-micro), background var(--t-micro);
  }
  .tb-icon svg { width: 22px; height: 22px; }
  .tb-icon:hover { color: var(--text); background: var(--surface); }
  .tb-icon:active { background: var(--surface-2); }
  .tb-cart { position: relative; justify-self: end; }
  .tb-cart .cart-badge {
    position: absolute; top: 0; right: 0;
    min-width: 16px; height: 16px; padding: 0 3px;
    border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent);
    font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    display: grid; place-items: center; line-height: 1;
    border: 2px solid var(--bg);
  }

  /* --- пошук --- */
  .m-search { display: flex; gap: 8px; padding: 12px var(--s-4) 6px; }
  .m-search .ms-field {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-pill); padding: 0 14px; height: 44px;
    transition: border-color var(--t-micro);
  }
  .m-search .ms-field:focus-within { border-color: var(--accent); }
  .m-search .ms-field svg { width: 16px; height: 16px; color: var(--faint); flex: none; }
  .m-search input {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: var(--text); font-size: 14px; font-family: var(--font-body); height: 100%;
  }
  .m-search input::placeholder { color: var(--faint); }
  .m-search .ms-x {
    color: var(--faint); flex: none; display: none;
  }
  .m-search .ms-field.has-val .ms-x { display: block; }
  .m-search .ms-filter {
    width: 44px; height: 44px; flex: none;
    border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface-2);
    display: grid; place-items: center; color: var(--muted);
  }
  .m-search .ms-filter:hover { color: var(--text); border-color: var(--faint); }
  .m-search .ms-filter svg { width: 18px; height: 18px; }

  /* --- герой-карусель --- */
  .hero-carousel {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; padding: 12px var(--s-4) 4px;
  }
  .hero-carousel::-webkit-scrollbar { display: none; }
  .hero-slide {
    scroll-snap-align: center; flex: 0 0 calc(100% - 32px);
    position: relative; overflow: hidden;
    border-radius: var(--r-xl); border: 1px solid var(--border);
    background: var(--bg-elev); min-height: 170px;
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 16px 16px 18px;
    box-shadow: var(--shadow-card);
  }
  .hero-slide .hs-photo {
    position: absolute; right: -8%; top: 50%; transform: translateY(-50%);
    width: 64%; height: 128%; object-fit: cover; z-index: 0;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 42%);
    mask-image: linear-gradient(90deg, transparent 0, #000 42%);
  }
  .hero-slide::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(95deg, var(--bg-elev) 34%, rgba(16,14,10,.2) 62%, transparent 80%);
  }
  :root[data-app-theme="light"] .hero-slide::before {
    background: linear-gradient(95deg, var(--bg-elev) 34%, rgba(255,253,247,.25) 62%, transparent 80%);
  }
  .hero-slide::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; z-index: 2;
    background: repeating-linear-gradient(-45deg, var(--accent) 0 9px, var(--on-accent) 9px 18px);
    opacity: .9;
  }
  .hero-slide > * { position: relative; z-index: 2; }
  .hero-slide .hs-eyebrow {
    font-family: var(--font-display); font-size: 11px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-ink);
    margin-top: 4px;
  }
  .hero-slide .hs-title {
    font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.0;
    letter-spacing: 0.01em; text-transform: uppercase; color: var(--text);
    margin-top: 6px; max-width: 64%; text-wrap: balance;
  }
  .hero-slide .hs-sub { font-size: 12px; color: var(--muted); margin-top: 6px; max-width: 60%; }
  .hero-slide .hs-cta {
    margin-top: auto; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 7px;
    height: 38px; padding: 0 16px; border-radius: var(--r-pill);
    background: var(--accent); color: var(--on-accent);
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .hero-slide .hs-cta svg { width: 15px; height: 15px; }
  .hero-slide .hs-cta:active { background: var(--accent-press); transform: scale(.97); }
  .hero-dots { display: flex; gap: 5px; justify-content: center; padding: 8px 0 2px; }
  .hero-dots > i {
    width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--surface-3);
    transition: width var(--t-base) var(--e-out), background var(--t-base) var(--e-out);
  }
  .hero-dots > i.on { background: var(--accent); width: 18px; }

  /* --- категорії-кружечки --- */
  .cat-circles {
    display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none;
    padding: 14px var(--s-4) 14px;
    position: sticky; top: 0; z-index: 4;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .cat-circles::-webkit-scrollbar { display: none; }
  .cat-circle {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    flex: none; width: 58px;
  }
  .cat-circle .cc-ic {
    width: 54px; height: 54px; border-radius: var(--r-pill);
    display: grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    transition: background var(--t-micro), border-color var(--t-micro), color var(--t-micro), box-shadow var(--t-base);
  }
  .cat-circle .cc-ic svg { width: 24px; height: 24px; }
  .cat-circle .cc-label {
    font-size: 10px; font-weight: 700; color: var(--muted);
    text-align: center; white-space: nowrap; letter-spacing: 0.01em;
  }
  .cat-circle:hover .cc-ic { border-color: var(--faint); color: var(--text); }
  .cat-circle[aria-pressed="true"] .cc-ic {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    box-shadow: var(--glow);
  }
  .cat-circle[aria-pressed="true"] .cc-label { color: var(--accent-ink); }

  /* --- секція «Популярне» --- */
  .row-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 16px var(--s-4) 8px;
  }
  .row-head .rh-title {
    font-family: var(--font-display); font-weight: 700; font-size: 17px;
    letter-spacing: 0.02em; text-transform: uppercase; color: var(--text);
  }
  .row-head .rh-all {
    font-family: var(--font-display); font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-ink);
    display: inline-flex; align-items: center; gap: 3px;
  }
  .row-head .rh-all svg { width: 13px; height: 13px; }
  .pop-row {
    display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none;
    padding: 0 var(--s-4) 6px;
  }
  .pop-row::-webkit-scrollbar { display: none; }
  .pop-card {
    flex: 0 0 162px; position: relative; text-align: left;
    border: 1px solid var(--border); border-radius: var(--r-lg);
    background: var(--surface); overflow: hidden;
    transition: border-color var(--t-micro), transform var(--t-micro);
  }
  .pop-card:hover { border-color: var(--faint); }
  .pop-card:active { transform: scale(.985); }
  .pop-card .pc-photo {
    width: 100%; aspect-ratio: 5 / 4; object-fit: cover; display: block;
    background: var(--surface-2);
  }
  .pop-card .pc-photo svg { width: 100%; height: 100%; }
  .pop-card .pc-badge {
    position: absolute; left: 8px; top: 8px;
    font-family: var(--font-display); font-size: 9px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 6px; border-radius: var(--r-xs);
    background: var(--accent); color: var(--on-accent);
  }
  .pop-card .pc-badge.alt { background: var(--text); color: var(--bg); }
  .pop-card .pc-body { padding: 10px; }
  .pop-card .pc-name {
    font-weight: 700; font-size: 13px; line-height: 1.2; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pop-card .pc-rating {
    display: flex; align-items: center; gap: 4px; margin-top: 5px;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  }
  .pop-card .pc-rating svg { width: 12px; height: 12px; color: var(--accent); flex: none; }
  .pop-card .pc-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .pop-card .pc-price { font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--text); }
  .pop-card .pc-add {
    width: 30px; height: 30px; flex: none; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent); border-radius: var(--r-sm);
    transition: transform var(--t-micro);
  }
  .pop-card .pc-add svg { width: 15px; height: 15px; }
  .pop-card .pc-add:active { transform: scale(.88); }

  /* --- промо-банер --- */
  .promo-banner {
    position: relative; overflow: hidden;
    width: 100%; margin: 18px 0 10px; padding: 18px var(--s-4);
    border: 0; border-radius: 0;
    background: linear-gradient(105deg, var(--bg-elev), var(--surface-2));
    display: flex; align-items: center; gap: 14px; min-height: 96px; text-align: left;
  }
  .promo-banner::before, .promo-banner::after {
    content: ""; position: absolute; left: 0; right: 0; height: 5px;
    background: repeating-linear-gradient(-45deg, var(--accent) 0 9px, var(--on-accent) 9px 18px);
    opacity: .9;
  }
  .promo-banner::before { top: 0; }
  .promo-banner::after { bottom: 0; }
  .promo-banner .pb-txt { flex: 1; min-width: 0; }
  .promo-banner .pb-k {
    display: block;
    font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.04;
    letter-spacing: 0.01em; text-transform: uppercase; color: var(--accent-ink);
  }
  .promo-banner .pb-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .promo-banner .pb-badge {
    width: 56px; height: 56px; flex: none; border-radius: var(--r-pill);
    background: var(--accent); color: var(--on-accent);

    grid-template-columns: 84px 1fr auto;
    align-items: center;

    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    background: var(--surface);
  }
  .menu-item:hover { background: var(--surface-2); border-color: var(--faint); }
  .menu-item:active { background: var(--surface-2); transform: scale(.995); }
  .menu-thumb { width: 84px; height: 84px; border-radius: var(--r-md); }
  .menu-item .mi-name { font-size: 14px; }
  .menu-item .mi-rating {
    display: flex; align-items: center; gap: 4px; margin-top: 4px;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  }
  .menu-item .mi-rating svg { width: 12px; height: 12px; color: var(--accent); flex: none; }
  .menu-item .mi-desc { -webkit-line-clamp: 1; margin-top: 4px; }
  .menu-item .mi-tags { margin-top: 6px; }
  .mi-add { border-radius: var(--r-sm); }

  /* --- порожній пошук --- */
  .m-empty {
    padding: 40px var(--s-5); text-align: center; color: var(--muted); font-size: 13px;
  }

     РЕДИЗАЙН 2.0 — решта екранів під нову мову (картки, скруглення). Лише CSS.

  .btn { border-radius: var(--r-md); }

  .field input, .field select { min-height: 48px; border-radius: var(--r-md); }

  .helper-note { border-radius: var(--r-md); border-left-width: 3px; margin: 0 var(--s-4) var(--s-4); }
  .m-search .ms-field, .m-search .ms-filter { height: 46px; }

  .line-item {
    grid-template-columns: 66px 1fr auto;
    align-items: center;
    margin: 0 var(--s-4) 10px;

    border: 1px solid var(--border); border-bottom: 1px solid var(--border);
    border-radius: var(--r-lg); background: var(--surface);

  .line-item .li-thumb { width: 66px; height: 66px; border-radius: var(--r-md); }
  .line-item .li-name { font-size: 14px; }

  .summary {
    margin: 6px var(--s-4) 12px; padding: 14px 16px;
    border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface);
  }
  .summary-row.total { font-family: var(--font-display); letter-spacing: 0.01em; }

  .reward-card .rc-ic { border-radius: var(--r-md); }
  .coupon-row { border-radius: var(--r-md); }

  /* ШАУМАНЧІКИ — комірки м’якші */
  .cobra-cell { border-radius: var(--r-lg); }

  /* КАРТКА лояльності / QR — м’якші */
  .loyalty-card { border-radius: var(--r-xl); }
  .code-card { border-radius: var(--r-xl); }

  /* МАПА: рядок точки → картка у списку */
  .loc-card {
    box-sizing: border-box;
    width: calc(100% - var(--s-6)); /* база має width:100% — інакше з полями тече за екран */

    padding: 12px 14px;
    border: 1px solid var(--border); border-bottom: 1px solid var(--border);

    border-radius: var(--r-lg); background: var(--surface);

  .loc-card.is-focused { border-left-color: var(--accent); }
  .sat-wrap, .poland-wrap { border-radius: var(--r-xl); }
  .city-seg { border-radius: var(--r-md); }
  .city-seg button { border-radius: var(--r-sm); }

  /* ПРОФІЛЬ / шторки: рядок-посилання → картка */

    /* inline style ставить width:100%; на <button> auto = shrink-to-fit,

    box-sizing: border-box;

    margin: 0 var(--s-4) 8px;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-lg); background: var(--surface);
  }
  .link-row:hover { background: var(--surface-2); border-color: var(--faint); }
  .link-row .lr-text { font-size: 14px; }
  /* у шторках трохи щільніше — на всю ширину тіла шторки */
  .sheet-body .link-row { width: 100% !important; margin: 0 0 8px; }
  .sheet-body .link-row:first-of-type { margin-top: 0; }

  .section-label { font-size: 12px; letter-spacing: 0.16em; color: var(--muted); padding: 20px var(--s-4) 10px; }

function $(sel, root) { return (root || document).querySelector(sel); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function uid(p) { return (p || 'id') + '-' + Math.random().toString(36).slice(2, 8); }
function nf(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function zl(n) { return nf(n) + ' zł'; }

/** Українська відмінкова форма: forms = [1, 2-4, 5-0] */
function plural(n, forms) {
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5) return forms[1];
  if (b === 1) return forms[0];
  return forms[2];
}
function pShauman(n) { return nf(n) + ' ' + plural(n, ['шауман', 'шаумани', 'шауманів']); }

function hhmmToMin(s) { var p = s.split(':'); return (+p[0]) * 60 + (+p[1]); }

/**

 * @returns {{kind:'open'|'soon'|'closed', text:string}}
 */
function locStatus(loc, now) {
  var mins = now.getHours() * 60 + now.getMinutes();
  var o = hhmmToMin(loc.hours.open), c = hhmmToMin(loc.hours.close);
  if (mins >= o && mins < c) {
    if (c - mins <= 45) return { kind: 'soon', text: 'Зачиняється о ' + loc.hours.close };
    return { kind: 'open', text: 'Відкрито до ' + loc.hours.close };
  }
  return { kind: 'closed', text: 'Зачинено · відкриється о ' + loc.hours.open };
}

/**
 * Валідація довільних даних із localStorage — ручний guard замість Zod
 * (у середовищі артефакту немає збірки/залежностей). Невідоме -> дефолт.
 * @param {unknown} raw
 */
function parseState(raw) {
  var def = defaultState();
  if (!raw || typeof raw !== 'object') return def;
  var o = /** @type {Record<string, unknown>} */ (raw);
  var s = def;

  if (typeof o.onboarded === 'boolean') s.onboarded = o.onboarded;

  if (o.profile && typeof o.profile === 'object') {
    var p = o.profile;
    if (typeof p.name === 'string' && p.name.trim()) s.profile.name = p.name.slice(0, 24);
    if (typeof p.favLoc === 'string' && locById(p.favLoc)) s.profile.favLoc = p.favLoc;
    if (typeof p.city === 'string' && CITIES.some(function (c) { return c.id === p.city; })) s.profile.city = p.city;
  }
  if (o.mapCity === 'all' || (typeof o.mapCity === 'string' && CITIES.some(function (c) { return c.id === o.mapCity; }))) s.mapCity = o.mapCity;
  else s.mapCity = s.profile.city;
  if (typeof o.mapFocus === 'string' && locById(o.mapFocus)) s.mapFocus = o.mapFocus;
  if (typeof o.points === 'number' && isFinite(o.points)) s.points = clamp(Math.round(o.points), 0, 9999999);
  if (typeof o.lifetimePoints === 'number' && isFinite(o.lifetimePoints)) {
    s.lifetimePoints = clamp(Math.round(o.lifetimePoints), 0, 9999999);
  }
  if (Array.isArray(o.coupons)) {
    s.coupons = o.coupons.filter(function (c) {
      return c && typeof c === 'object' && typeof c.code === 'string' && typeof c.label === 'string';
    }).slice(0, 40);
  }
  if (Array.isArray(o.ledger)) {
    s.ledger = o.ledger.filter(function (e) {
      return e && typeof e.delta === 'number' && typeof e.reason === 'string';
    }).slice(0, 200);
  }
  if (Array.isArray(o.history)) {
    s.history = o.history.filter(function (h) {
      return h && typeof h.id === 'string' &&
        ['preparing', 'ready', 'given'].indexOf(h.status) !== -1 && Array.isArray(h.lines);
    }).slice(0, 50);
  }
  if (Array.isArray(o.cart)) {
    s.cart = o.cart.filter(function (l) {
      return l && typeof l === 'object' && itemById(l.itemId) && typeof l.qty === 'number' && l.qty > 0;
    }).map(function (l) {
      return {
        lineId: typeof l.lineId === 'string' ? l.lineId : uid('ln'),
        itemId: l.itemId,
        qty: clamp(Math.round(l.qty), 1, 20),
        addonIds: Array.isArray(l.addonIds) ? l.addonIds.filter(function (a) { return addonById(a); }) : [],
        sauceIds: Array.isArray(l.sauceIds) ? l.sauceIds.filter(function (a) { return sauceById(a); }) : []
      };
    });
  }
  if (['rewards', 'history'].indexOf(o.walletTab) !== -1) s.walletTab = o.walletTab;
  if (CATS.some(function (c) { return c.id === o.menuCat; })) s.menuCat = o.menuCat;
  if (Array.isArray(o.usedPromos)) {
    s.usedPromos = o.usedPromos.filter(function (x) { return typeof x === 'string'; }).slice(0, 40);
  }
  if (o.settings && typeof o.settings === 'object') {
    if (typeof o.settings.reduceMotion === 'boolean') s.settings.reduceMotion = o.settings.reduceMotion;
    if (o.settings.theme === 'light' || o.settings.theme === 'dark') s.settings.theme = o.settings.theme;
    if (['ua', 'pl', 'en'].indexOf(o.settings.lang) !== -1) s.settings.lang = o.settings.lang;
  }
  return s;
}

var state = defaultState();
var _overlay = null;      // поточний оверлей (див. union вище)
var _saveTimer = 0;

function persist() {
  clearTimeout(_saveTimer);
  _saveTimer = window.setTimeout(function () {
    try {
      var snap = {
        onboarded: state.onboarded, profile: state.profile, points: state.points,
        lifetimePoints: state.lifetimePoints, coupons: state.coupons,
        ledger: state.ledger, history: state.history, cart: state.cart,
        walletTab: state.walletTab, menuCat: state.menuCat, settings: state.settings, usedPromos: state.usedPromos,
        mapCity: state.mapCity, mapFocus: state.mapFocus
      };
      localStorage.setItem(STORE_KEY, JSON.stringify(snap));
    } catch (e) { /* приватний режим / квота — демо працює й без збереження */ }
  }, 250);
}

function loadState() {
  var raw = null;
  try {
    var txt = localStorage.getItem(STORE_KEY);
    raw = txt ? JSON.parse(txt) : null;
  } catch (e) { raw = null; }
  state = parseState(raw);
  state.checkout = { status: 'idle' };
  state.checkoutDraft = null;
}

function setState(patch) {
  Object.assign(state, patch);
  persist();
  render();
}

/* =====================================================================
   СЕЛЕКТОРИ (похідні від стану, без побічних ефектів)
   ===================================================================== */
function linePrice(line) {
  var it = itemById(line.itemId);
  if (!it) return 0;
  var add = line.addonIds.reduce(function (s, id) {
    var a = addonById(id); return s + (a ? a.price : 0);
  }, 0);
  return (it.price + add) * line.qty;
}
function cartCount() { return state.cart.reduce(function (s, l) { return s + l.qty; }, 0); }
function cartSubtotal() { return state.cart.reduce(function (s, l) { return s + linePrice(l); }, 0); }

/** Скільки шауманів за 1 zł */
var EARN_RATE = 3;

/** Чи підходить позиція під `free`-нагороду ({id} | {ids:[]} | {cat}) */
function freeMatches(free, itemId) {
  if (!free) return false;
  if (free.id) return itemId === free.id;
  if (free.ids) return free.ids.indexOf(itemId) !== -1;
  if (free.cat) { var it = itemById(itemId); return it && it.cat === free.cat; }
  return false;
}
/** Вартість безкоштовної позиції в кошику під `free` (найдорожча з відповідних, 1 шт, без добавок). */
function freeItemValue(free) {
  var best = 0;
  state.cart.forEach(function (l) {
    if (!freeMatches(free, l.itemId)) return;
    var it = itemById(l.itemId);
    if (it && it.price > best) best = it.price;
  });
  return best;
}

/** Активна знижка/нагорода на чекауті: {kind:'disc',value,...} | {kind:'free',free,...} | null */
function activeDiscount() {
  var d = state.checkoutDraft;
  if (!d) return null;
  if (d.discount === 'promo') return { kind: 'disc', value: 10, label: 'Промокод ODESA −10%', source: 'promo' };
  if (d.discount && d.discount.indexOf('coupon:') === 0) {
    var code = d.discount.slice(7);
    var c = state.coupons.find(function (x) { return x.code === code && !x.used; });
    if (c && c.kind === 'disc') return { kind: 'disc', value: c.value, label: c.label, source: code };
    if (c && c.kind === 'free') return { kind: 'free', free: c.free, label: c.label, source: code };
  }
  return null;
}
function discountAmount(sub) {
  var d = activeDiscount();
  if (!d) return 0;
  if (d.kind === 'free') return Math.min(sub, freeItemValue(d.free));
  return Math.round(sub * d.value / 100);
}
function cartTotal() {
  var sub = cartSubtotal();
  return Math.max(0, sub - discountAmount(sub));
}
function earnPoints() { return Math.round(cartTotal() * EARN_RATE); }

function menuItemsFor(cat) {
  if (cat === 'pop') return ITEMS.filter(function (i) { return i.tags.indexOf('hit') !== -1; });
  return ITEMS.filter(function (i) { return i.cat === cat; });
}
function lineFor(itemId) {
  // Тільки для позицій без кастомізації (швидкі +/- у списку меню)
  return state.cart.find(function (l) {
    return l.itemId === itemId && l.addonIds.length === 0 && (!l.sauceIds || l.sauceIds.length === 0);
  }) || null;
}

    var code = 'SH-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    var c = rw.disc
      ? { id: uid('c'), code: code, used: false, ts: Date.now(), kind: 'disc', value: rw.disc, label: rw.name }
      : { id: uid('c'), code: code, used: false, ts: Date.now(), kind: 'free', free: rw.free, label: rw.name };
    state.coupons.unshift(c);
    state.ledger.unshift({ id: uid('l'), ts: Date.now(), delta: -rw.cost, reason: 'Нагорода: ' + rw.name });
    persist();
    closeOverlay(true);
    render();
    toast('Купон додано — застосуй його при оформленні', 'accent');
  },

  editName: function () { openOverlay({ type: 'name' }); },
  saveName: function (d, ev) {
    if (ev && ev.preventDefault) ev.preventDefault();
    var input = $('#nameInput');
    if (!input) return;
    var v = input.value.trim();
    var errEl = $('#nameErr');
    if (v.length < 2 || v.length > 24) {
      input.setAttribute('aria-invalid', 'true');
      if (errEl) errEl.textContent = 'Ім’я має бути від 2 до 24 символів.';
      input.focus();
      return;
    }
    state.profile.name = v;
    persist();
    closeOverlay(true);
    render();
    toast('Ім’я оновлено', 'accent');
  },
  setFav: function (d) {
    var loc = locById(d.id);
    if (!loc) return;
    state.profile.favLoc = loc.id;
    state.profile.city = loc.city;
    state.mapCity = loc.city;
    state.mapFocus = loc.id;
    persist();
    render();
    toast('Улюблена точка: ' + loc.addr, 'accent');
  },
  toggleReduceMotion: function () {
    state.settings.reduceMotion = !state.settings.reduceMotion;
    persist();
    render();
  },
  confirmReset: function () {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state = defaultState();
    _overlay = null;
    persist();
    renderOnboarding();
    render();
    toast('Демо скинуто до початкового стану');
  },
  noop: function () {}
};

/* ---- допоміжні для actions ---- */

function completeOrder() {
  var d = state.checkoutDraft;
  var total = cartTotal();
  var pts = earnPoints();
  var id = 'SH-' + (2050 + state.history.length + Math.floor(Math.random() * 40));
  var order = {
    id: id, status: 'preparing', ts: Date.now(), locId: d.locId, total: total, points: pts,
    pay: d.pay, etaMin: 18 + Math.floor(Math.random() * 10),
    lines: state.cart.map(function (l) { return { itemId: l.itemId, qty: l.qty, addonIds: l.addonIds.slice(), sauceIds: (l.sauceIds || []).slice() }; })
  };
  state.history.unshift(order);
  state.points += pts;
  state.lifetimePoints += pts;
  state.ledger.unshift({ id: uid('l'), ts: Date.now(), delta: pts, reason: 'Замовлення #' + id });

  // застосувати обраний купон-подарунок / знижку як «використаний»
  var disc = activeDiscount();
  if (disc && disc.source && disc.source !== 'promo') {
    var c = state.coupons.find(function (x) { return x.code === disc.source; });
    if (c) c.used = true;
  }
  state.cart = [];
  state.checkout = { status: 'done', orderId: id };
  state.checkoutDraft = null;

  // авто-перехід статусу замовлення preparing -> ready
  window.setTimeout(function () {
    var o = state.history.find(function (x) { return x.id === id; });
    if (o && o.status === 'preparing') { o.status = 'ready'; persist(); render(); }
  }, 12000);

  persist();
  setState({ nav: 'confirm' });
  focusScreen();
}
</script>

function locCardHTML(loc, now, focus) {
